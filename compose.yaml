# QuantRule deployment — quantrule.deploy/v1
#
# One bridge network, one published port, three named volumes. The default
# topology is nine containers: the six service binaries from one image plus
# Postgres, the object store, and the broker. `data`, `model`, `evidence`, and
# `simulation` serve the catalog, model compute, runs/research, and the research
# plane; the gateway proxies all four. Only the backtest worker serves no HTTP.
#
# Windows and macOS run this file through Docker Desktop's Linux backend
# (WSL2 on Windows). The image is linux/amd64.

name: quantrule

x-server: &server
  image: ${QR_IMAGE:-quantrule-server:local}
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  networks:
    - quantrule
  # Keep service-name resolution inside the compose network. The engine
  # inherits the operator's search domain, so a stopped `data` could otherwise
  # resolve to a LAN host that answers on the same port.
  dns_search:
    - .
  environment: &server-environment
    QR_DATABASE_URL: postgres://quantrule:${QR_POSTGRES_PASSWORD:-quantrule}@postgres:5432/quantrule
    # The gateway and the backtest worker reach qr-data through this URL; both
    # refuse to start without it. Data is not published on the host.
    QR_DATA_URL: http://data:8080
    # The gateway proxies /model/compute to qr-model and refuses to start
    # without this URL.
    QR_MODEL_URL: http://model:8080
    # The gateway proxies runs and hypotheses to qr-evidence, and the backtest
    # worker uses its internal lifecycle; both refuse to start without this URL.
    QR_EVIDENCE_URL: http://evidence:8080
    # The gateway proxies the simulation research plane to qr-simulation and
    # refuses to start without this URL.
    QR_SIMULATION_URL: http://simulation:8080
    QR_OBJECT_STORE_URL: http://minio:9000
    QR_OBJECT_BUCKET: quantrule
    QR_QUEUE_URL: amqp://quantrule:${QR_RABBITMQ_PASSWORD:-quantrule}@rabbitmq:5672/%2f
    QR_STATIC_DIR: /srv/static
    QR_CONFIG_ROOT: /srv/config
    # Diagnostic stage rows and their object-store blobs expire after this many
    # days. Evidence applies the cleanup at startup and hourly; a run and its
    # artifacts are never touched.
    QR_STAGE_RETENTION_DAYS: "30"
    # Each schema owner migrates its own ledger: the gateway applies the gateway
    # ledger, data applies catalog, evidence applies runs and research, and
    # simulation applies its own simulation ledger. The runtime pins the
    # session-level advisory lock to one connection, so the four migrate at once
    # without the old sole-migrator workaround. The backtest worker and model
    # keep this at 0.
    QR_MIGRATE: "0"
    # Set at release time to the image digest. An empty value would be rejected
    # by the runtime, so the key is a pass-through: unset stays unset.
    QR_IMAGE_DIGEST:
    AWS_ACCESS_KEY_ID: quantrule
    AWS_SECRET_ACCESS_KEY: ${QR_OBJECT_STORE_PASSWORD:-quantrule}
    AWS_REGION: us-east-1

# The probe reads the service's own `/health`; a running container is not a
# healthy service. The workers have no HTTP surface and therefore no entry here.
x-gateway-healthcheck: &gateway-healthcheck
  test:
    - CMD-SHELL
    - curl -fsS http://127.0.0.1:8080/ready | grep -q '"state":"healthy"'
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 10s

x-healthcheck: &http-healthcheck
  test:
    - CMD-SHELL
    - curl -fsS http://127.0.0.1:8080/health | grep -q '"state":"healthy"'
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 10s

services:
  gateway:
    <<: *server
    command: ["qr-gateway"]
    environment:
      <<: *server-environment
      QR_MIGRATE: "1"
      # `make remote` exports this before Compose runs. The empty default keeps
      # the local stack unauthenticated; the runtime treats an empty value as
      # unset, so `make up` behaves exactly as before.
      QR_BEARER_TOKEN: ${QR_BEARER_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      data:
        condition: service_healthy
      model:
        condition: service_healthy
      evidence:
        condition: service_healthy
      simulation:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *gateway-healthcheck

  data:
    <<: *server
    command: ["qr-data"]
    environment:
      <<: *server-environment
      # qr-data owns the catalog schema and applies its own ledger. The gateway
      # no longer migrates the catalog; P1's pinned lock lets the two run at
      # once.
      QR_MIGRATE: "1"
    volumes:
      # The repository config/ is the read-only catalog source. qr-data owns it
      # now; the gateway proxies the public config routes.
      - ./config:/srv/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck: *http-healthcheck

  model:
    <<: *server
    command: ["qr-model"]
    environment:
      <<: *server-environment
      # qr-model owns no database schema and applies no migration; it reads the
      # catalog through qr-data and the dataset objects from the object store.
      QR_MIGRATE: "0"
    depends_on:
      data:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck: *http-healthcheck

  backtest:
    <<: *server
    command: ["qr-backtest"]
    environment:
      <<: *server-environment
      # Each run consumer owns a channel and one prefetch slot; the stage
      # consumer always keeps its own slot.
      QR_BACKTEST_CONCURRENCY: ${QR_BACKTEST_CONCURRENCY:-1}
    depends_on:
      data:
        condition: service_healthy
      model:
        condition: service_healthy
      evidence:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # A worker serves no HTTP and publishes no liveness probe, so it has no
    # healthcheck. Docker reports the process state; /health reports the
    # dependencies. A worker probe is part of the split.

  evidence:
    <<: *server
    command: ["qr-evidence"]
    environment:
      <<: *server-environment
      # qr-evidence owns the runs and research schemas, including the run
      # attempts ledger (0013), and applies them on start. The gateway migrates
      # only its own gateway ledger.
      QR_MIGRATE: "1"
    depends_on:
      data:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *http-healthcheck

  simulation:
    <<: *server
    command: ["qr-simulation"]
    environment:
      <<: *server-environment
      # qr-simulation owns the simulation schema and applies its own ledger. It
      # reads a recorded model bundle from the object store, not a run or a
      # config mount.
      QR_MIGRATE: "1"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck: *http-healthcheck

  postgres:
    # Pinned so a fresh `make up` resolves the same database image; override
    # QR_POSTGRES_IMAGE to move the pin deliberately.
    image: ${QR_POSTGRES_IMAGE:-postgres@sha256:846a7ddaa67a4b354ae1d21087b683901aa6113a4ed626d3787cfbf6c85e3e07}
    restart: unless-stopped
    networks:
      - quantrule
    environment:
      POSTGRES_USER: quantrule
      POSTGRES_PASSWORD: ${QR_POSTGRES_PASSWORD:-quantrule}
      POSTGRES_DB: quantrule
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantrule -d quantrule"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    # MinIO withdrew its public images on 2026-09-11. The pinned Bitnami legacy
    # archive is the available amd64 source until a registry decision is
    # recorded; override QR_OBJECT_STORE_IMAGE to point at a maintained mirror.
    image: ${QR_OBJECT_STORE_IMAGE:-bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c}
    restart: unless-stopped
    networks:
      - quantrule
    environment:
      MINIO_ROOT_USER: quantrule
      MINIO_ROOT_PASSWORD: ${QR_OBJECT_STORE_PASSWORD:-quantrule}
      # The runtime assumes the bucket exists; the image creates it on first
      # start.
      MINIO_DEFAULT_BUCKETS: quantrule
      MINIO_BROWSER: "off"
    volumes:
      - objects:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    # Pinned so a fresh `make up` resolves the same broker image; override
    # QR_RABBITMQ_IMAGE to move the pin deliberately.
    image: ${QR_RABBITMQ_IMAGE:-rabbitmq@sha256:753099a19b577c322117f793f864b3129cbba96d40317221a69d73976e3c843c}
    restart: unless-stopped
    networks:
      - quantrule
    environment:
      RABBITMQ_DEFAULT_USER: quantrule
      RABBITMQ_DEFAULT_PASS: ${QR_RABBITMQ_PASSWORD:-quantrule}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - mqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  quantrule:
    driver: bridge

volumes:
  pgdata:
  objects:
  mqdata:
