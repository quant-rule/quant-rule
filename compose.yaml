# QuantRule deployment — quantrule.deploy/v1
#
# One bridge network, one published port. The default topology is ten
# long-running containers: the seven service binaries from one image plus
# Postgres, the object store, and the broker, all three over TLS. `pki-init`
# stages the certificates for the stock non-root service UIDs; a one-shot
# db-bootstrap creates the four logical databases and their owner/app roles, then
# four one-shot migration jobs apply each owner ledger. The database-owning
# services start with only their application credential. `data`, `model`,
# `evidence`, and `simulation` serve the catalog, model compute, runs/research,
# and the research plane; the gateway proxies all four. `strategy` serves the
# internal signal route, and the backtest worker serves only an internal
# metrics/health/readiness listener, never a public API.
#
# Windows and macOS run this file through Docker Desktop's Linux backend
# (WSL2 on Windows). The image is linux/amd64.

name: quantrule

x-server: &server
  image: ${QR_IMAGE:-quantrule-server:local}
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  # The worker deadline is 25 s and the HTTP deadline is 20 s. Docker waits 15 s
  # more than the longest deadline before it force-kills a task.
  stop_grace_period: 40s
  networks:
    - quantrule
  # Keep service-name resolution inside the compose network. The engine
  # inherits the operator's search domain, so a stopped `data` could otherwise
  # resolve to a LAN host that answers on the same port.
  dns_search:
    - .
  environment: &server-environment
    # Each database-owning service receives its own application URL below.
    # Model and backtest own no database and receive no URL.
    # The gateway, backtest worker and strategy service reach qr-data through
    # this URL; each refuses to start without it. Data is not on the host.
    QR_DATA_URL: http://data:8080
    # The gateway proxies /model/compute and the strategy service resolves a
    # frozen bundle; both refuse to start without this URL.
    QR_MODEL_URL: http://model:8080
    # The gateway proxies runs and hypotheses to qr-evidence, and the backtest
    # worker uses its internal lifecycle; both refuse to start without this URL.
    QR_EVIDENCE_URL: http://evidence:8080
    # The gateway proxies the simulation research plane to qr-simulation and
    # refuses to start without this URL.
    QR_SIMULATION_URL: http://simulation:8080
    # The gateway probes the seventh service only when this URL is set. The v2
    # multi-host profile leaves it absent and still starts.
    QR_STRATEGY_URL: http://strategy:8080
    QR_OBJECT_STORE_URL: https://minio:9000
    QR_OBJECT_BUCKET: quantrule
    # Every declared queue name carries this generation. A changed queue
    # declaration moves to a new generation instead of redeclaring a live name;
    # the old generation drains or is retired deliberately.
    QR_QUEUE_GENERATION: "1"
    QR_STATIC_DIR: /srv/static
    QR_CONFIG_ROOT: /srv/config
    # Structured logs are one JSON object per line on stderr. Local debugging
    # can opt into QR_LOG_FORMAT=text; the server profile keeps JSON.
    QR_LOG_FORMAT: json
    # The internal Prometheus listener. It is on the private container network
    # only and is never published to the host. Unset disables it; the gateway
    # does not proxy it. PLAT-006 owns the scrape configuration.
    QR_METRICS_BIND: 0.0.0.0:9090
    # SIGTERM drains instead of killing in-flight work. The HTTP deadline bounds
    # a request and the worker deadline bounds a run or stage; both are below
    # the 40 s stop grace period.
    QR_DRAIN_TIMEOUT_HTTP: "20"
    QR_DRAIN_TIMEOUT_WORK: "25"
    # Diagnostic stage rows and their object-store blobs expire after this many
    # days. Evidence applies the cleanup at startup and hourly; a run and its
    # artifacts are never touched.
    QR_STAGE_RETENTION_DAYS: "30"
    # The long-running services never migrate. A one-shot `<service>-migrate`
    # job applies each database owner's ledger with --migrate-only before the
    # service starts. The runtime pins the session-level advisory lock to one
    # connection, so the four jobs may run at once. Every long-running service
    # keeps this at 0; the backtest worker and model have no database.
    QR_MIGRATE: "0"
    # Set at release time to the image digest. An empty value would be rejected
    # by the runtime, so the key is a pass-through: unset stays unset.
    QR_IMAGE_DIGEST:

# The probe reads the service's own `/health`; a running container is not a
# healthy service. The workers have no public HTTP surface and therefore no entry
# here; their internal metrics listener is not a liveness probe.
x-gateway-healthcheck: &gateway-healthcheck
  test:
    - CMD-SHELL
    - curl -fsS http://127.0.0.1:8080/ready | grep -q '"state":"healthy"'
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 10s

x-healthcheck: &http-healthcheck
  test:
    - CMD-SHELL
    - curl -fsS http://127.0.0.1:8080/health | grep -q '"state":"healthy"'
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 10s

services:
  gateway:
    <<: *server
    command: ["qr-gateway"]
    environment:
      <<: *server-environment
      # The gateway owns the profiles database. The long-running process has
      # the application role only; the one-shot gateway-migrate job below has
      # the owner URL. Every application secret arrives as a mounted file:
      # `docker inspect` and `/proc/<pid>/environ` never carry the value.
      QR_DATABASE_URL_FILE: /run/secrets/qr_gateway_database_url
      QR_DATABASE_TLS_CA_PATH: /run/pki/ca.crt
      QR_OBJECT_STORE_TLS_CA_PATH: /run/pki/ca.crt
      QR_MIGRATE: "0"
    secrets:
      - qr_gateway_database_url
    volumes:
      - ${QR_PKI_DIR:-./pki}/ca.crt:/run/pki/ca.crt:ro
    ports:
      - "8080:8080"
    depends_on:
      data:
        condition: service_healthy
      model:
        condition: service_healthy
      evidence:
        condition: service_healthy
      simulation:
        condition: service_healthy
      strategy:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      gateway-migrate:
        condition: service_completed_successfully
    healthcheck: *gateway-healthcheck

  data:
    <<: *server
    command: ["qr-data"]
    environment:
      <<: *server-environment
      # qr-data owns the catalog database. The long-running process has the
      # application role only; data-migrate has the owner URL.
      QR_DATABASE_URL_FILE: /run/secrets/qr_catalog_database_url
      QR_DATABASE_TLS_CA_PATH: /run/pki/ca.crt
      QR_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/object_store_access_key
      QR_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/object_store_secret_key
      QR_OBJECT_STORE_TLS_CA_PATH: /run/pki/ca.crt
      QR_MIGRATE: "0"
    secrets:
      - qr_catalog_database_url
      - object_store_access_key
      - object_store_secret_key
    volumes:
      # The repository config/ is the read-only catalog source. qr-data owns it
      # now; the gateway proxies the public config routes.
      - ./config:/srv/config:ro
      - ${QR_PKI_DIR:-./pki}/ca.crt:/run/pki/ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      data-migrate:
        condition: service_completed_successfully
    healthcheck: *http-healthcheck

  model:
    <<: *server
    command: ["qr-model"]
    environment:
      <<: *server-environment
      # qr-model owns no database and applies no migration; it reads the
      # catalog through qr-data and the dataset objects from the object store.
      QR_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/object_store_access_key
      QR_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/object_store_secret_key
      QR_OBJECT_STORE_TLS_CA_PATH: /run/pki/ca.crt
      QR_MIGRATE: "0"
    secrets:
      - object_store_access_key
      - object_store_secret_key
    volumes:
      - ${QR_PKI_DIR:-./pki}/ca.crt:/run/pki/ca.crt:ro
    depends_on:
      data:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck: *http-healthcheck

  strategy:
    <<: *server
    command: ["qr-strategy"]
    # The seventh service receives only its data, model, object-store and image
    # identity. It owns no database, declares no queue, mounts no config, and
    # applies no migration.
    environment:
      QR_DATA_URL: http://data:8080
      QR_MODEL_URL: http://model:8080
      QR_OBJECT_STORE_URL: https://minio:9000
      QR_OBJECT_BUCKET: quantrule
      QR_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/object_store_access_key
      QR_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/object_store_secret_key
      QR_OBJECT_STORE_TLS_CA_PATH: /run/pki/ca.crt
      QR_MIGRATE: "0"
      QR_LOG_FORMAT: json
      QR_METRICS_BIND: 0.0.0.0:9090
      QR_DRAIN_TIMEOUT_HTTP: "20"
      QR_IMAGE_DIGEST:
    secrets:
      - object_store_access_key
      - object_store_secret_key
    volumes:
      - ${QR_PKI_DIR:-./pki}/ca.crt:/run/pki/ca.crt:ro
    depends_on:
      data:
        condition: service_healthy
      model:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck: *http-healthcheck

  backtest:
    <<: *server
    command: ["qr-backtest"]
    environment:
      <<: *server-environment
      # qr-backtest owns no database and needs no database URL; it loads the
      # dataset and config from data, the model bundle from model, and records
      # the run through evidence.
      # Each run consumer owns a channel and one prefetch slot; the stage
      # consumer always keeps its own slot.
      QR_BACKTEST_CONCURRENCY: ${QR_BACKTEST_CONCURRENCY:-1}
      QR_QUEUE_URL_FILE: /run/secrets/queue_url
      QR_QUEUE_TLS_CA_PATH: /run/pki/ca.crt
      QR_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/object_store_access_key
      QR_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/object_store_secret_key
      QR_OBJECT_STORE_TLS_CA_PATH: /run/pki/ca.crt
    secrets:
      - queue_url
      - object_store_access_key
      - object_store_secret_key
    volumes:
      - ${QR_PKI_DIR:-./pki}/ca.crt:/run/pki/ca.crt:ro
    depends_on:
      data:
        condition: service_healthy
      model:
        condition: service_healthy
      evidence:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # A worker serves no public HTTP API. Its internal listener carries
    # `/metrics`, `/health` and `/ready` on the private container network; that
    # port is never published. The probe reads the worker's own dependency
    # report, not just whether the process is running.
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9090/health | grep -q '"state":"healthy"'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  evidence:
    <<: *server
    command: ["qr-evidence"]
    environment:
      <<: *server-environment
      # qr-evidence owns the evidence database: runs, research, and stage,
      # including the run-attempts ledger (0013). The long-running process has
      # the application role only; evidence-migrate has the owner URL.
      QR_DATABASE_URL_FILE: /run/secrets/qr_evidence_database_url
      QR_DATABASE_TLS_CA_PATH: /run/pki/ca.crt
      QR_QUEUE_URL_FILE: /run/secrets/queue_url
      QR_QUEUE_TLS_CA_PATH: /run/pki/ca.crt
      QR_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/object_store_access_key
      QR_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/object_store_secret_key
      QR_OBJECT_STORE_TLS_CA_PATH: /run/pki/ca.crt
      QR_MIGRATE: "0"
    secrets:
      - qr_evidence_database_url
      - queue_url
      - object_store_access_key
      - object_store_secret_key
    volumes:
      - ${QR_PKI_DIR:-./pki}/ca.crt:/run/pki/ca.crt:ro
    depends_on:
      data:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      evidence-migrate:
        condition: service_completed_successfully
    healthcheck: *http-healthcheck

  simulation:
    <<: *server
    command: ["qr-simulation"]
    environment:
      <<: *server-environment
      # qr-simulation owns the simulation database. The long-running process
      # has the application role only; simulation-migrate has the owner URL.
      QR_DATABASE_URL_FILE: /run/secrets/qr_simulation_database_url
      QR_DATABASE_TLS_CA_PATH: /run/pki/ca.crt
      QR_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/object_store_access_key
      QR_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/object_store_secret_key
      QR_OBJECT_STORE_TLS_CA_PATH: /run/pki/ca.crt
      QR_MIGRATE: "0"
    secrets:
      - qr_simulation_database_url
      - object_store_access_key
      - object_store_secret_key
    volumes:
      - ${QR_PKI_DIR:-./pki}/ca.crt:/run/pki/ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      simulation-migrate:
        condition: service_completed_successfully
    healthcheck: *http-healthcheck

  # One-shot bootstrap for the four logical databases and their owner/app
  # roles. It runs after Postgres is healthy and before every migration job.
  db-bootstrap:
    image: ${QR_POSTGRES_IMAGE:-postgres@sha256:846a7ddaa67a4b354ae1d21087b683901aa6113a4ed626d3787cfbf6c85e3e07}
    restart: "no"
    networks:
      - quantrule
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: quantrule
      PGPASSWORD: ${QR_POSTGRES_PASSWORD:-quantrule}
      PGDATABASE: quantrule
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/pki/ca.crt
      QR_DB_ROLE_PASSWORD: ${QR_POSTGRES_PASSWORD:-quantrule}
    volumes:
      - ./deploy/postgres/bootstrap.sh:/bootstrap/bootstrap.sh:ro
      - ${QR_PKI_DIR:-./pki}/ca.crt:/run/pki/ca.crt:ro
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot owner migration jobs. Each receives only its owner URL, applies
  # one ledger through --migrate-only, and exits. The long-running service that
  # follows never sees the owner credential.
  gateway-migrate:
    <<: *server
    command: ["qr-gateway", "--migrate-only"]
    restart: "no"
    environment:
      QR_DATABASE_OWNER_URL_FILE: /run/secrets/qr_gateway_owner_database_url
      QR_MIGRATE: "0"
      QR_DATABASE_TLS_CA_PATH: /run/pki/ca.crt
      QR_OBJECT_STORE_TLS_CA_PATH: /run/pki/ca.crt
    secrets:
      - qr_gateway_owner_database_url
    volumes:
      - ${QR_PKI_DIR:-./pki}/ca.crt:/run/pki/ca.crt:ro
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  data-migrate:
    <<: *server
    command: ["qr-data", "--migrate-only"]
    restart: "no"
    environment:
      QR_DATABASE_OWNER_URL_FILE: /run/secrets/qr_catalog_owner_database_url
      QR_MIGRATE: "0"
      QR_DATABASE_TLS_CA_PATH: /run/pki/ca.crt
      QR_OBJECT_STORE_TLS_CA_PATH: /run/pki/ca.crt
    secrets:
      - qr_catalog_owner_database_url
    volumes:
      - ${QR_PKI_DIR:-./pki}/ca.crt:/run/pki/ca.crt:ro
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  evidence-migrate:
    <<: *server
    command: ["qr-evidence", "--migrate-only"]
    restart: "no"
    environment:
      QR_DATABASE_OWNER_URL_FILE: /run/secrets/qr_evidence_owner_database_url
      QR_MIGRATE: "0"
      QR_DATABASE_TLS_CA_PATH: /run/pki/ca.crt
      QR_OBJECT_STORE_TLS_CA_PATH: /run/pki/ca.crt
    secrets:
      - qr_evidence_owner_database_url
    volumes:
      - ${QR_PKI_DIR:-./pki}/ca.crt:/run/pki/ca.crt:ro
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  simulation-migrate:
    <<: *server
    command: ["qr-simulation", "--migrate-only"]
    restart: "no"
    environment:
      QR_DATABASE_OWNER_URL_FILE: /run/secrets/qr_simulation_owner_database_url
      QR_MIGRATE: "0"
      QR_DATABASE_TLS_CA_PATH: /run/pki/ca.crt
      QR_OBJECT_STORE_TLS_CA_PATH: /run/pki/ca.crt
    secrets:
      - qr_simulation_owner_database_url
    volumes:
      - ${QR_PKI_DIR:-./pki}/ca.crt:/run/pki/ca.crt:ro
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # One-shot root init that stages the mounted PKI into service-owned volumes.
  # The database, broker and store keep their stock non-root users; only this
  # copy step runs as root, and the private key stays 0600.
  pki-init:
    image: ${QR_POSTGRES_IMAGE:-postgres@sha256:846a7ddaa67a4b354ae1d21087b683901aa6113a4ed626d3787cfbf6c85e3e07}
    restart: "no"
    networks:
      - quantrule
    environment:
      QR_PKI_POSTGRES_UID: ${QR_PKI_POSTGRES_UID:-999}
      QR_PKI_POSTGRES_GID: ${QR_PKI_POSTGRES_GID:-999}
      QR_PKI_RABBITMQ_UID: ${QR_PKI_RABBITMQ_UID:-999}
      QR_PKI_RABBITMQ_GID: ${QR_PKI_RABBITMQ_GID:-999}
      QR_PKI_MINIO_UID: ${QR_PKI_MINIO_UID:-1001}
      QR_PKI_MINIO_GID: ${QR_PKI_MINIO_GID:-1001}
    volumes:
      - ./deploy/pki/init.sh:/pki/init.sh:ro
      - ${QR_PKI_DIR:-./pki}/postgres:/src/postgres:ro
      - ${QR_PKI_DIR:-./pki}/rabbitmq:/src/rabbitmq:ro
      - ${QR_PKI_DIR:-./pki}/minio:/src/minio:ro
      - pgpki:/pki/postgres
      - mqpki:/pki/rabbitmq
      - miniopki:/pki/minio
    entrypoint: ["/bin/sh", "/pki/init.sh"]

  postgres:
    # Pinned so a fresh `make up` resolves the same database image; override
    # QR_POSTGRES_IMAGE to move the pin deliberately.
    image: ${QR_POSTGRES_IMAGE:-postgres@sha256:846a7ddaa67a4b354ae1d21087b683901aa6113a4ed626d3787cfbf6c85e3e07}
    restart: unless-stopped
    networks:
      - quantrule
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/pki/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/pki/server.key
      - -c
      - ssl_ca_file=/var/lib/postgresql/pki/ca.crt
      - -c
      - ssl_min_protocol_version=TLSv1.2
    environment:
      POSTGRES_USER: quantrule
      POSTGRES_PASSWORD: ${QR_POSTGRES_PASSWORD:-quantrule}
      POSTGRES_DB: quantrule
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgpki:/var/lib/postgresql/pki:ro
    depends_on:
      pki-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantrule -d quantrule"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    # MinIO withdrew its public images on 2026-09-11. The pinned Bitnami legacy
    # archive is the available amd64 source until a registry decision is
    # recorded; override QR_OBJECT_STORE_IMAGE to point at a maintained mirror.
    image: ${QR_OBJECT_STORE_IMAGE:-bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c}
    restart: unless-stopped
    networks:
      - quantrule
    environment:
      MINIO_ROOT_USER: quantrule
      MINIO_ROOT_PASSWORD: ${QR_OBJECT_STORE_PASSWORD:-quantrule}
      # The runtime assumes the bucket exists; the image creates it on first
      # start.
      MINIO_DEFAULT_BUCKETS: quantrule
      MINIO_BROWSER: "off"
      MINIO_SCHEME: https
      # The image's own liveness probe calls curl over https; the private CA is
      # not in the system store, so curl reads it from the staged CAs directory.
      CURL_CA_BUNDLE: /certs/CAs/ca.crt
    volumes:
      - objects:/bitnami/minio/data
      - miniopki:/certs:ro
    depends_on:
      pki-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS https://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    # Pinned so a fresh `make up` resolves the same broker image; override
    # QR_RABBITMQ_IMAGE to move the pin deliberately.
    image: ${QR_RABBITMQ_IMAGE:-rabbitmq@sha256:753099a19b577c322117f793f864b3129cbba96d40317221a69d73976e3c843c}
    restart: unless-stopped
    networks:
      - quantrule
    environment:
      RABBITMQ_DEFAULT_USER: quantrule
      RABBITMQ_DEFAULT_PASS: ${QR_RABBITMQ_PASSWORD:-quantrule}
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_CONFIG_FILE: /etc/rabbitmq/rabbitmq.conf
    volumes:
      - mqdata:/var/lib/rabbitmq
      - mqpki:/var/lib/rabbitmq/pki:ro
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    depends_on:
      pki-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  quantrule:
    driver: bridge

secrets:
  qr_gateway_database_url:
    file: ${QR_SECRETS_DIR:-./secrets}/qr_gateway_database_url
  qr_catalog_database_url:
    file: ${QR_SECRETS_DIR:-./secrets}/qr_catalog_database_url
  qr_evidence_database_url:
    file: ${QR_SECRETS_DIR:-./secrets}/qr_evidence_database_url
  qr_simulation_database_url:
    file: ${QR_SECRETS_DIR:-./secrets}/qr_simulation_database_url
  qr_gateway_owner_database_url:
    file: ${QR_SECRETS_DIR:-./secrets}/qr_gateway_owner_database_url
  qr_catalog_owner_database_url:
    file: ${QR_SECRETS_DIR:-./secrets}/qr_catalog_owner_database_url
  qr_evidence_owner_database_url:
    file: ${QR_SECRETS_DIR:-./secrets}/qr_evidence_owner_database_url
  qr_simulation_owner_database_url:
    file: ${QR_SECRETS_DIR:-./secrets}/qr_simulation_owner_database_url
  queue_url:
    file: ${QR_SECRETS_DIR:-./secrets}/queue_url
  object_store_access_key:
    file: ${QR_SECRETS_DIR:-./secrets}/object_store_access_key
  object_store_secret_key:
    file: ${QR_SECRETS_DIR:-./secrets}/object_store_secret_key

volumes:
  pgdata:
  objects:
  mqdata:
  pgpki:
  mqpki:
  miniopki:
