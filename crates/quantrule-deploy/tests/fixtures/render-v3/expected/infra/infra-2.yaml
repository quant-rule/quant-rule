name: "quantrule-infra-infra-2"
networks:
  quantrule:
    external: true
    name: "quantrule"
services:
  alertmanager:
    container_name: "quantrule-alertmanager-infra-2"
    image: "prom/alertmanager@sha256:62187e72213c4a4a0d1e1634c2350b73f3a1320777fb2274827a1f8c524f0ff2"
    networks:
      -
        "quantrule"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: false
        source: "/srv/quantrule/alertmanager/data"
        target: "/alertmanager"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/alertmanager/alertmanager.yml"
        target: "/etc/alertmanager/alertmanager.yml"
        type: "bind"
  etcd:
    container_name: "quantrule-etcd-infra-2"
    image: "quay.io/coreos/etcd@sha256:a6cec115044c30857d8458d120facbaa2251f21fd4ad39296a99017468d482dc"
    networks:
      -
        "quantrule"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: false
        source: "/srv/quantrule/etcd/data"
        target: "/etcd-data"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/etcd/etcd.conf.yml"
        target: "/etc/etcd/etcd.conf.yml"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/etcd"
        target: "/etc/quantrule/pki"
        type: "bind"
  loki:
    container_name: "quantrule-loki-infra-2"
    image: "grafana/loki@sha256:e13e67451cba9b2074bf13220303cb12e4ef2316709cd6f0fbd6f8f76b59e2d5"
    networks:
      -
        "quantrule"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: false
        source: "/srv/quantrule/loki/data"
        target: "/loki"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/loki/loki.yml"
        target: "/etc/loki/loki.yml"
        type: "bind"
  minio:
    container_name: "quantrule-minio-infra-2"
    image: "minio/minio@sha256:bdf0781acceb93983c15eec9e56bfbd59dcadc98ea57467022d61aeee074a2cc"
    networks:
      quantrule:
        aliases:
          -
            "minio"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: false
        source: "/srv/quantrule/minio/infra-2/drive1"
        target: "/data1"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/minio/minio.conf"
        target: "/etc/minio/minio.conf"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/minio"
        target: "/etc/quantrule/pki"
        type: "bind"
  patroni:
    container_name: "quantrule-patroni-infra-2"
    image: "postgres@sha256:dc184ed86a2b6421fd5ea1bf2ffa3d6e9f1df86796bf0830a7476eb064a186ff"
    networks:
      -
        "quantrule"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: false
        source: "/srv/quantrule/patroni/data"
        target: "/var/lib/postgresql/data"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/patroni/patroni.yml"
        target: "/etc/patroni/patroni.yml"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/postgres"
        target: "/etc/quantrule/pki"
        type: "bind"
  rabbitmq:
    container_name: "quantrule-rabbitmq-infra-2"
    image: "rabbitmq@sha256:605a57a95a166325381f132867163eafc20cb0ece6039504e45681136550e6b7"
    networks:
      quantrule:
        aliases:
          -
            "rabbitmq"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: false
        source: "/srv/quantrule/rabbitmq/data"
        target: "/var/lib/rabbitmq"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/rabbitmq/rabbitmq.conf"
        target: "/etc/rabbitmq/rabbitmq.conf"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/rabbitmq"
        target: "/etc/quantrule/pki"
        type: "bind"
x-quantrule:
  evidence: "HA profile (unverified)"
  network: "overlay, attachable, encrypted; created by bootstrap.sh"
  owner: "HA-012"
  platform: "unit configuration belongs to PLAT-003/004/005/006; this file only pins the image, host volumes, and overlay attachment"
  profile: "swarm-ha"
