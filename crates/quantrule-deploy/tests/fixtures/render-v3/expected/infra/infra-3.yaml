name: "quantrule-infra-infra-3"
networks:
  quantrule:
    external: true
    name: "quantrule"
services:
  etcd:
    command:
      -
        "etcd"
      -
        "--config-file"
      -
        "/etc/etcd/etcd.conf.yml"
    container_name: "quantrule-etcd-infra-3"
    image: "quay.io/coreos/etcd@sha256:316f5d367455f75a327f9dc72f669cbf645651859fa2e272f692a1f2dee6f5c9"
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "50m"
    networks:
      quantrule:
        aliases:
          -
            "etcd-infra-3"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: false
        source: "/srv/quantrule/etcd/data"
        target: "/etcd-data"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/etcd/etcd.conf.yml"
        target: "/etc/etcd/etcd.conf.yml"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/ca.crt"
        target: "/etc/quantrule/pki/ca.crt"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/etcd"
        target: "/etc/quantrule/pki/etcd"
        type: "bind"
  minio-infra-3:
    command:
      -
        "/bin/sh"
      -
        "-c"
      -
        "set -eu\numask 077\nexport MINIO_ROOT_USER=\"$$(cat /run/secrets/minio_root_user)\"\nexport MINIO_ROOT_PASSWORD=\"$$(cat /run/secrets/minio_root_password)\"\n. /etc/minio/minio.conf\nexec minio server --certs-dir /certs"
    container_name: "quantrule-minio-infra-3"
    environment:
      MINIO_BROWSER: "off"
      MINIO_CONFIG_ENV_FILE: "/etc/minio/minio.conf"
      MINIO_ROOT_PASSWORD_FILE: "/run/secrets/minio_root_password"
      MINIO_ROOT_USER_FILE: "/run/secrets/minio_root_user"
      MINIO_SERVER_URL: "https://minio:9000"
    hostname: "minio-infra-3"
    image: "minio/minio@sha256:bdf0781acceb93983c15eec9e56bfbd59dcadc98ea57467022d61aeee074a2cc"
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "50m"
    networks:
      quantrule:
        aliases:
          -
            "minio-infra-3"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: false
        source: "/srv/quantrule/minio/infra-3/drive1"
        target: "/data1"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/minio/minio.conf"
        target: "/etc/minio/minio.conf"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/minio"
        target: "/certs"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/minio_root_user"
        target: "/run/secrets/minio_root_user"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/minio_root_password"
        target: "/run/secrets/minio_root_password"
        type: "bind"
  node-exporter-infra-3:
    command:
      -
        "--path.rootfs=/host"
      -
        "--collector.textfile.directory=/var/lib/node_exporter/textfile"
      -
        "--web.listen-address=0.0.0.0:9100"
    container_name: "quantrule-node-exporter-infra-3"
    healthcheck:
      interval: "15s"
      retries: 5
      start_period: "60s"
      test:
        -
          "CMD-SHELL"
        -
          "wget -q -O /dev/null http://127.0.0.1:9100/metrics"
      timeout: "5s"
    image: "prom/node-exporter@sha256:7296504d4ada44b7d7ab4431e27e9f9900d8488f8d55842f4b12ae2704e16dfe"
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "50m"
    networks:
      quantrule:
        aliases:
          -
            "node-infra-3"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        bind:
          propagation: "rslave"
        read_only: true
        source: "/"
        target: "/host"
        type: "bind"
      -
        read_only: true
        source: "/srv/quantrule/node_exporter/textfile"
        target: "/var/lib/node_exporter/textfile"
        type: "bind"
  patroni:
    command:
      -
        "/bin/sh"
      -
        "-c"
      -
        "set -eu\numask 077\nexport PATRONI_SUPERUSER_PASSWORD=\"$$(cat /run/secrets/postgres_superuser_password)\"\nexport PATRONI_REPLICATION_PASSWORD=\"$$(cat /run/secrets/patroni_replication_password)\"\nexport PATRONI_REWIND_PASSWORD=\"$$(cat /run/secrets/patroni_rewind_password)\"\nexport PATRONI_RESTAPI_PASSWORD=\"$$(cat /run/secrets/patroni_rest_password)\"\nexec patroni /etc/patroni/patroni.yml"
    container_name: "quantrule-patroni-infra-3"
    image: "batonogov/patroni-docker@sha256:0de7dc8bc5919c76721bee1475ed30155b1848c0a6bac7298605bf39eef1a7eb"
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "50m"
    networks:
      quantrule:
        aliases:
          -
            "patroni-infra-3"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: false
        source: "/srv/quantrule/patroni/data"
        target: "/var/lib/postgresql/data"
        type: "bind"
      -
        read_only: false
        source: "/srv/quantrule/patroni/wal-archive"
        target: "/srv/quantrule/wal-archive"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/patroni/patroni.yml"
        target: "/etc/patroni/patroni.yml"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/ca.crt"
        target: "/etc/quantrule/pki/ca.crt"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/postgres"
        target: "/etc/quantrule/pki/postgres"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/etcd"
        target: "/etc/quantrule/pki/etcd"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/postgres_superuser_password"
        target: "/run/secrets/postgres_superuser_password"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/patroni_replication_password"
        target: "/run/secrets/patroni_replication_password"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/patroni_rewind_password"
        target: "/run/secrets/patroni_rewind_password"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/patroni_rest_password"
        target: "/run/secrets/patroni_rest_password"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/rabbitmq_erlang_cookie"
        target: "/run/secrets/rabbitmq_erlang_cookie"
        type: "bind"
  promtail-infra-3:
    command:
      -
        "-config.file=/etc/promtail/promtail.yml"
    container_name: "quantrule-promtail-infra-3"
    healthcheck:
      interval: "15s"
      retries: 5
      start_period: "60s"
      test:
        -
          "CMD-SHELL"
        -
          "wget -q -O /dev/null http://127.0.0.1:9080/ready"
      timeout: "5s"
    image: "grafana/promtail@sha256:a761cb834cfaeee29745440d4884d6748f0a08d8f68928db1d707018c1dcfbe9"
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "50m"
    networks:
      quantrule:
        aliases:
          -
            "promtail-infra-3"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    user: "0:0"
    volumes:
      -
        read_only: true
        source: "/etc/quantrule/promtail/promtail-infra-3.yml"
        target: "/etc/promtail/promtail.yml"
        type: "bind"
      -
        read_only: true
        source: "/var/run/docker.sock"
        target: "/var/run/docker.sock"
        type: "bind"
      -
        read_only: false
        source: "/srv/quantrule/promtail"
        target: "/var/lib/promtail"
        type: "bind"
  rabbitmq-broker-infra-3:
    command:
      -
        "/bin/sh"
      -
        "-c"
      -
        "set -eu\numask 077\ninstall -d -o rabbitmq -g rabbitmq -m 700 /var/lib/rabbitmq/pki\ninstall -o rabbitmq -g rabbitmq -m 600 /etc/quantrule/rabbitmq/erlang.cookie /var/lib/rabbitmq/.erlang.cookie\ninstall -o rabbitmq -g rabbitmq -m 600 /etc/quantrule/rabbitmq/rabbitmq.conf /var/lib/rabbitmq/rabbitmq.conf\ninstall -o rabbitmq -g rabbitmq -m 600 /etc/quantrule/rabbitmq/enabled_plugins /var/lib/rabbitmq/enabled_plugins\ninstall -o rabbitmq -g rabbitmq -m 644 /etc/quantrule/pki/rabbitmq/ca.crt /var/lib/rabbitmq/pki/ca.crt\ninstall -o rabbitmq -g rabbitmq -m 644 /etc/quantrule/pki/rabbitmq/server.crt /var/lib/rabbitmq/pki/server.crt\ninstall -o rabbitmq -g rabbitmq -m 600 /etc/quantrule/pki/rabbitmq/server.key /var/lib/rabbitmq/pki/server.key\nchown -R rabbitmq:rabbitmq /var/lib/rabbitmq /srv/quantrule/rabbitmq/definitions\nexport RABBITMQ_CONFIG_FILE=/var/lib/rabbitmq/rabbitmq.conf\nexport RABBITMQ_ENABLED_PLUGINS_FILE=/var/lib/rabbitmq/enabled_plugins\nexec gosu rabbitmq rabbitmq-server"
    container_name: "quantrule-rabbitmq-infra-3"
    environment:
      RABBITMQ_CONFIG_FILE: "/var/lib/rabbitmq/rabbitmq.conf"
      RABBITMQ_ENABLED_PLUGINS_FILE: "/var/lib/rabbitmq/enabled_plugins"
      RABBITMQ_NODENAME: "rabbit@rabbitmq-infra-3"
    hostname: "rabbitmq-infra-3"
    image: "rabbitmq@sha256:183272aa2ff82718cabeef343de8d9a900931ea65fda4e563fed2a6d9efde578"
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "50m"
    networks:
      quantrule:
        aliases:
          -
            "rabbitmq-infra-3"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    user: "0:0"
    volumes:
      -
        read_only: false
        source: "/srv/quantrule/rabbitmq/data"
        target: "/var/lib/rabbitmq"
        type: "bind"
      -
        read_only: false
        source: "/srv/quantrule/rabbitmq/definitions"
        target: "/srv/quantrule/rabbitmq/definitions"
        type: "bind"
      -
        read_only: true
        source: "/srv/quantrule/rabbitmq/conf.d"
        target: "/etc/rabbitmq/conf.d"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/rabbitmq/rabbitmq.conf"
        target: "/etc/rabbitmq/rabbitmq.conf"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/rabbitmq/enabled_plugins"
        target: "/etc/rabbitmq/enabled_plugins"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/rabbitmq/erlang.cookie"
        target: "/etc/quantrule/rabbitmq/erlang.cookie"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/rabbitmq"
        target: "/etc/quantrule/pki/rabbitmq"
        type: "bind"
x-quantrule:
  evidence: "HA profile (unverified)"
  network: "overlay, attachable, encrypted; created by bootstrap.sh"
  owner: "PLAT-003/PLAT-004/PLAT-005/PLAT-006"
  platform: "keepalived is PLAT-002; Patroni, etcd, and HAProxy are configured by PLAT-003; RabbitMQ is PLAT-004; MinIO is PLAT-005; Prometheus, Alertmanager, Loki, Grafana, blackbox, node_exporter, and promtail are PLAT-006"
  profile: "swarm-ha"
