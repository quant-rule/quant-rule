name: "quantrule-infra-infra-1"
networks:
  quantrule:
    external: true
    name: "quantrule"
services:
  etcd:
    command:
      -
        "etcd"
      -
        "--config-file"
      -
        "/etc/etcd/etcd.conf.yml"
    container_name: "quantrule-etcd-infra-1"
    image: "quay.io/coreos/etcd@sha256:a6cec115044c30857d8458d120facbaa2251f21fd4ad39296a99017468d482dc"
    networks:
      quantrule:
        aliases:
          -
            "etcd-infra-1"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: false
        source: "/srv/quantrule/etcd/data"
        target: "/etcd-data"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/etcd/etcd.conf.yml"
        target: "/etc/etcd/etcd.conf.yml"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/ca.crt"
        target: "/etc/quantrule/pki/ca.crt"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/etcd"
        target: "/etc/quantrule/pki/etcd"
        type: "bind"
  grafana:
    container_name: "quantrule-grafana-infra-1"
    image: "grafana/grafana@sha256:2e28e87d9b98ca68880a966df73ad63f90db6b4df6ae86637e130f52f48264ba"
    networks:
      -
        "quantrule"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: false
        source: "/srv/quantrule/grafana/data"
        target: "/var/lib/grafana"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/grafana"
        target: "/etc/grafana/provisioning"
        type: "bind"
  minio:
    container_name: "quantrule-minio-infra-1"
    image: "minio/minio@sha256:bdf0781acceb93983c15eec9e56bfbd59dcadc98ea57467022d61aeee074a2cc"
    networks:
      quantrule:
        aliases:
          -
            "minio"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: false
        source: "/srv/quantrule/minio/infra-1/drive1"
        target: "/data1"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/minio/minio.conf"
        target: "/etc/minio/minio.conf"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/minio"
        target: "/etc/quantrule/pki"
        type: "bind"
  patroni:
    command:
      -
        "/bin/sh"
      -
        "-c"
      -
        "set -eu\numask 077\nexport PATRONI_SUPERUSER_PASSWORD=\"$$(cat /run/secrets/postgres_superuser_password)\"\nexport PATRONI_REPLICATION_PASSWORD=\"$$(cat /run/secrets/patroni_replication_password)\"\nexport PATRONI_REWIND_PASSWORD=\"$$(cat /run/secrets/patroni_rewind_password)\"\nexport PATRONI_RESTAPI_PASSWORD=\"$$(cat /run/secrets/patroni_rest_password)\"\nexec patroni /etc/patroni/patroni.yml"
    container_name: "quantrule-patroni-infra-1"
    image: "patroni/patroni@sha256:e78141e6fe0807c466f17d8343f99249c7480a94d603bc03f91b10e79e7b94fd"
    networks:
      quantrule:
        aliases:
          -
            "patroni-infra-1"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: false
        source: "/srv/quantrule/patroni/data"
        target: "/var/lib/postgresql/data"
        type: "bind"
      -
        read_only: false
        source: "/srv/quantrule/patroni/wal-archive"
        target: "/srv/quantrule/wal-archive"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/patroni/patroni.yml"
        target: "/etc/patroni/patroni.yml"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/ca.crt"
        target: "/etc/quantrule/pki/ca.crt"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/postgres"
        target: "/etc/quantrule/pki/postgres"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/etcd"
        target: "/etc/quantrule/pki/etcd"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/postgres_superuser_password"
        target: "/run/secrets/postgres_superuser_password"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/patroni_replication_password"
        target: "/run/secrets/patroni_replication_password"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/patroni_rewind_password"
        target: "/run/secrets/patroni_rewind_password"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/patroni_rest_password"
        target: "/run/secrets/patroni_rest_password"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/rabbitmq_erlang_cookie"
        target: "/run/secrets/rabbitmq_erlang_cookie"
        type: "bind"
  prometheus:
    container_name: "quantrule-prometheus-infra-1"
    image: "prom/prometheus@sha256:c4bfb1e3ef91709eca17ae08b3676ac008939765ad9cf6c2b4617f363b1354be"
    networks:
      -
        "quantrule"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: false
        source: "/srv/quantrule/prometheus/data"
        target: "/prometheus"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/prometheus/prometheus.yml"
        target: "/etc/prometheus/prometheus.yml"
        type: "bind"
  rabbitmq-broker-infra-1:
    command:
      -
        "/bin/sh"
      -
        "-c"
      -
        "set -eu\numask 077\ninstall -d -o rabbitmq -g rabbitmq -m 700 /var/lib/rabbitmq/pki\ninstall -o rabbitmq -g rabbitmq -m 600 /etc/quantrule/rabbitmq/erlang.cookie /var/lib/rabbitmq/.erlang.cookie\ninstall -o rabbitmq -g rabbitmq -m 600 /etc/quantrule/rabbitmq/rabbitmq.conf /var/lib/rabbitmq/rabbitmq.conf\ninstall -o rabbitmq -g rabbitmq -m 600 /etc/quantrule/rabbitmq/enabled_plugins /var/lib/rabbitmq/enabled_plugins\ninstall -o rabbitmq -g rabbitmq -m 644 /etc/quantrule/pki/rabbitmq/ca.crt /var/lib/rabbitmq/pki/ca.crt\ninstall -o rabbitmq -g rabbitmq -m 644 /etc/quantrule/pki/rabbitmq/server.crt /var/lib/rabbitmq/pki/server.crt\ninstall -o rabbitmq -g rabbitmq -m 600 /etc/quantrule/pki/rabbitmq/server.key /var/lib/rabbitmq/pki/server.key\nchown -R rabbitmq:rabbitmq /var/lib/rabbitmq /srv/quantrule/rabbitmq/definitions\nexport RABBITMQ_CONFIG_FILE=/var/lib/rabbitmq/rabbitmq.conf\nexport RABBITMQ_ENABLED_PLUGINS_FILE=/var/lib/rabbitmq/enabled_plugins\nexec gosu rabbitmq rabbitmq-server"
    container_name: "quantrule-rabbitmq-infra-1"
    environment:
      RABBITMQ_CONFIG_FILE: "/var/lib/rabbitmq/rabbitmq.conf"
      RABBITMQ_ENABLED_PLUGINS_FILE: "/var/lib/rabbitmq/enabled_plugins"
      RABBITMQ_NODENAME: "rabbit@rabbitmq-infra-1"
    hostname: "rabbitmq-infra-1"
    image: "rabbitmq@sha256:605a57a95a166325381f132867163eafc20cb0ece6039504e45681136550e6b7"
    networks:
      quantrule:
        aliases:
          -
            "rabbitmq-infra-1"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    user: "0:0"
    volumes:
      -
        read_only: false
        source: "/srv/quantrule/rabbitmq/data"
        target: "/var/lib/rabbitmq"
        type: "bind"
      -
        read_only: false
        source: "/srv/quantrule/rabbitmq/definitions"
        target: "/srv/quantrule/rabbitmq/definitions"
        type: "bind"
      -
        read_only: true
        source: "/srv/quantrule/rabbitmq/conf.d"
        target: "/etc/rabbitmq/conf.d"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/rabbitmq/rabbitmq.conf"
        target: "/etc/rabbitmq/rabbitmq.conf"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/rabbitmq/enabled_plugins"
        target: "/etc/rabbitmq/enabled_plugins"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/rabbitmq/erlang.cookie"
        target: "/etc/quantrule/rabbitmq/erlang.cookie"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/rabbitmq"
        target: "/etc/quantrule/pki/rabbitmq"
        type: "bind"
x-quantrule:
  evidence: "HA profile (unverified)"
  network: "overlay, attachable, encrypted; created by bootstrap.sh"
  owner: "PLAT-003/PLAT-004"
  platform: "keepalived is PLAT-002; Patroni, etcd, and HAProxy are configured by PLAT-003; RabbitMQ is PLAT-004; MinIO and observability remain PLAT-005/006"
  profile: "swarm-ha"
