name: "quantrule-infra-edge-2"
networks:
  quantrule:
    external: true
    name: "quantrule"
services:
  haproxy:
    command:
      -
        "/bin/sh"
      -
        "-c"
      -
        "set -eu\numask 077\nauth=\"patroni:$$(cat /run/secrets/patroni_rest_password)\"\nencoded=$$(printf '%s' \"$$auth\" | base64 | tr -d '\\n')\nsed \"s|__PATRONI_REST_AUTH__|$$encoded|g\" /usr/local/etc/haproxy/haproxy.cfg > /tmp/haproxy.cfg\nexec haproxy -W -db -f /tmp/haproxy.cfg"
    container_name: "quantrule-haproxy-edge-2"
    image: "haproxy@sha256:2a88fcd69de33b07362a9b98f822f2b31f7607932356829cee9a5d44d851a2db"
    networks:
      quantrule:
        aliases:
          -
            "haproxy-edge-2"
          -
            "postgres"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: true
        source: "/etc/quantrule/haproxy/haproxy.cfg"
        target: "/usr/local/etc/haproxy/haproxy.cfg"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/patroni_rest_password"
        target: "/run/secrets/patroni_rest_password"
        type: "bind"
  keepalived:
    cap_add:
      -
        "NET_ADMIN"
      -
        "NET_BROADCAST"
    container_name: "quantrule-keepalived-edge-2"
    image: "osixia/keepalived@sha256:67a5f8c8ca46f83c69a30376f47eaa4704f29a0495675433812d5216b0171682"
    network_mode: "host"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: true
        source: "/etc/quantrule/keepalived.conf"
        target: "/etc/keepalived/keepalived.conf"
        type: "bind"
x-quantrule:
  evidence: "HA profile (unverified)"
  network: "overlay, attachable, encrypted; created by bootstrap.sh"
  owner: "PLAT-003"
  platform: "keepalived is PLAT-002; Patroni, etcd, and HAProxy are configured by PLAT-003; RabbitMQ, MinIO, and observability remain PLAT-004..006"
  profile: "swarm-ha"
