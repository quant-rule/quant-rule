name: "quantrule-infra-edge-1"
networks:
  quantrule:
    external: true
    name: "quantrule"
services:
  haproxy:
    container_name: "quantrule-haproxy-edge-1"
    image: "haproxy@sha256:2a88fcd69de33b07362a9b98f822f2b31f7607932356829cee9a5d44d851a2db"
    networks:
      quantrule:
        aliases:
          -
            "postgres"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: true
        source: "/etc/quantrule/haproxy/haproxy.cfg"
        target: "/usr/local/etc/haproxy/haproxy.cfg"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/haproxy"
        target: "/etc/quantrule/pki"
        type: "bind"
x-quantrule:
  evidence: "HA profile (unverified)"
  network: "overlay, attachable, encrypted; created by bootstrap.sh"
  owner: "HA-012"
  platform: "unit configuration belongs to PLAT-003/004/005/006; this file only pins the image, host volumes, and overlay attachment"
  profile: "swarm-ha"
