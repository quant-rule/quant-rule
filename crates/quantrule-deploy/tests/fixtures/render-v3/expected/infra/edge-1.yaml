name: "quantrule-infra-edge-1"
networks:
  quantrule:
    external: true
    name: "quantrule"
services:
  haproxy:
    command:
      -
        "/bin/sh"
      -
        "-c"
      -
        "set -eu\numask 077\nauth=\"patroni:$$(cat /run/secrets/patroni_rest_password)\"\nencoded=$$(printf '%s' \"$$auth\" | base64 | tr -d '\\n')\nsed \"s|__PATRONI_REST_AUTH__|$$encoded|g\" /usr/local/etc/haproxy/haproxy.cfg > /tmp/haproxy.cfg\nexec haproxy -W -db -f /tmp/haproxy.cfg"
    container_name: "quantrule-haproxy-edge-1"
    image: "haproxy@sha256:2a88fcd69de33b07362a9b98f822f2b31f7607932356829cee9a5d44d851a2db"
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "50m"
    networks:
      quantrule:
        aliases:
          -
            "haproxy-edge-1"
          -
            "postgres"
          -
            "rabbitmq"
          -
            "minio"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: true
        source: "/etc/quantrule/haproxy/haproxy.cfg"
        target: "/usr/local/etc/haproxy/haproxy.cfg"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/patroni_rest_password"
        target: "/run/secrets/patroni_rest_password"
        type: "bind"
  keepalived:
    cap_add:
      -
        "NET_ADMIN"
      -
        "NET_BROADCAST"
    container_name: "quantrule-keepalived-edge-1"
    image: "osixia/keepalived@sha256:67a5f8c8ca46f83c69a30376f47eaa4704f29a0495675433812d5216b0171682"
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "50m"
    network_mode: "host"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: true
        source: "/etc/quantrule/keepalived.conf"
        target: "/etc/keepalived/keepalived.conf"
        type: "bind"
  node-exporter-edge-1:
    command:
      -
        "--path.rootfs=/host"
      -
        "--collector.textfile.directory=/var/lib/node_exporter/textfile"
      -
        "--web.listen-address=0.0.0.0:9100"
    container_name: "quantrule-node-exporter-edge-1"
    healthcheck:
      interval: "15s"
      retries: 5
      start_period: "60s"
      test:
        -
          "CMD-SHELL"
        -
          "wget -q -O /dev/null http://127.0.0.1:9100/metrics"
      timeout: "5s"
    image: "prom/node-exporter@sha256:c26a6b6c79c6a303387b01b3dcfc34824e4cf03fe9c2e9899a762b601e46a680"
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "50m"
    networks:
      quantrule:
        aliases:
          -
            "node-edge-1"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        bind:
          propagation: "rslave"
        read_only: true
        source: "/"
        target: "/host"
        type: "bind"
      -
        read_only: true
        source: "/srv/quantrule/node_exporter/textfile"
        target: "/var/lib/node_exporter/textfile"
        type: "bind"
  promtail-edge-1:
    command:
      -
        "-config.file=/etc/promtail/promtail.yml"
    container_name: "quantrule-promtail-edge-1"
    healthcheck:
      interval: "15s"
      retries: 5
      start_period: "60s"
      test:
        -
          "CMD-SHELL"
        -
          "wget -q -O /dev/null http://127.0.0.1:9080/ready"
      timeout: "5s"
    image: "grafana/promtail@sha256:60b24aa368eea19a4fe8d35e294777963ba4a21f908a293de6f9e90d409ca919"
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "50m"
    networks:
      quantrule:
        aliases:
          -
            "promtail-edge-1"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    user: "0:0"
    volumes:
      -
        read_only: true
        source: "/etc/quantrule/promtail/promtail-edge-1.yml"
        target: "/etc/promtail/promtail.yml"
        type: "bind"
      -
        read_only: true
        source: "/var/run/docker.sock"
        target: "/var/run/docker.sock"
        type: "bind"
      -
        read_only: false
        source: "/srv/quantrule/promtail"
        target: "/var/lib/promtail"
        type: "bind"
x-quantrule:
  evidence: "HA profile (unverified)"
  network: "overlay, attachable, encrypted; created by bootstrap.sh"
  owner: "PLAT-003/PLAT-004/PLAT-005/PLAT-006"
  platform: "keepalived is PLAT-002; Patroni, etcd, and HAProxy are configured by PLAT-003; RabbitMQ is PLAT-004; MinIO is PLAT-005; Prometheus, Alertmanager, Loki, Grafana, blackbox, node_exporter, and promtail are PLAT-006"
  profile: "swarm-ha"
