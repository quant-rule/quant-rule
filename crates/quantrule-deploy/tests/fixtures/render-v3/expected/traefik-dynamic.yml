http:
  middlewares:
    request-body:
      buffering:
        maxRequestBodyBytes: 536870912
    security-headers:
      headers:
        contentTypeNosniff: true
        customResponseHeaders:
          Server: ""
        referrerPolicy: "no-referrer"
        stsIncludeSubdomains: true
        stsPreload: false
        stsSeconds: 31536000
  routers:
    gateway:
      entryPoints:
        -
          "websecure"
      middlewares:
        -
          "security-headers"
        -
          "request-body"
      rule: "Host(`quantrule.dev`)"
      service: "gateway"
      tls: {}
  services:
    gateway:
      loadBalancer:
        servers:
          -
            url: "http://quantrule-ha_gateway:8080"
tls:
  options:
    default:
      minVersion: "VersionTLS12"
  stores:
    default:
      defaultCertificate:
        certFile: "/etc/traefik/certs/ingress.crt"
        keyFile: "/etc/traefik/certs/ingress.key"
