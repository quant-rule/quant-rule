configs:
  quantrule_database_ca:
    external: true
    name: "quantrule_database_ca"
  quantrule_ingress_cert:
    external: true
    name: "quantrule_ingress_cert"
  quantrule_object_store_ca:
    external: true
    name: "quantrule_object_store_ca"
  quantrule_queue_ca:
    external: true
    name: "quantrule_queue_ca"
  quantrule_traefik:
    external: true
    name: "quantrule_traefik"
  quantrule_traefik_dynamic:
    external: true
    name: "quantrule_traefik_dynamic"
networks:
  quantrule:
    external: true
    name: "quantrule"
secrets:
  data_database_url:
    external: true
    name: "data_database_url"
  data_owner_database_url:
    external: true
    name: "data_owner_database_url"
  evidence_database_url:
    external: true
    name: "evidence_database_url"
  evidence_owner_database_url:
    external: true
    name: "evidence_owner_database_url"
  gateway_database_url:
    external: true
    name: "gateway_database_url"
  gateway_owner_database_url:
    external: true
    name: "gateway_owner_database_url"
  gateway_token:
    external: true
    name: "gateway_token"
  object_store_access_key:
    external: true
    name: "object_store_access_key"
  object_store_secret_key:
    external: true
    name: "object_store_secret_key"
  quantrule_ingress_key:
    external: true
    name: "quantrule_ingress_key"
  queue_url:
    external: true
    name: "queue_url"
  simulation_database_url:
    external: true
    name: "simulation_database_url"
  simulation_owner_database_url:
    external: true
    name: "simulation_owner_database_url"
services:
  backtest:
    command:
      -
        "qr-backtest"
    configs:
      -
        mode: 292
        source: "quantrule_queue_ca"
        target: "/run/quantrule/pki/queue-ca.crt"
      -
        mode: 292
        source: "quantrule_object_store_ca"
        target: "/run/quantrule/pki/object-store-ca.crt"
    deploy:
      labels:
        quantrule.evidence: "HA profile (unverified)"
        quantrule.kind: "backtest"
        quantrule.profile: "swarm-ha"
      placement:
        constraints:
          -
            "node.labels.quantrule.backtest == true"
          -
            "node.labels.quantrule.profile == swarm-ha"
          -
            "node.labels.quantrule.deploy == quantrule-ha"
        max_replicas_per_node: 1
        preferences:
          -
            spread: "node.labels.quantrule.domain"
      replicas: 3
      restart_policy:
        condition: "any"
        delay: "5s"
      rollback_config:
        delay: "5s"
        failure_action: "pause"
        max_failure_ratio: 0
        monitor: "180s"
        order: "stop-first"
        parallelism: 1
      update_config:
        delay: "10s"
        failure_action: "rollback"
        max_failure_ratio: 0
        monitor: "180s"
        order: "stop-first"
        parallelism: 1
    environment:
      QR_BACKTEST_CONCURRENCY: "1"
      QR_BIND: "0.0.0.0:9090"
      QR_DATA_URL: "http://data:8080"
      QR_EVIDENCE_URL: "http://evidence:8080"
      QR_IMAGE_DIGEST: "sha256:cdace4a996c06cd6142fb63eb23a52136c071d9450fe0e07f5556fc26b9edabe"
      QR_INTERNAL_ONLY: "1"
      QR_LOG_FORMAT: "json"
      QR_METRICS_BIND: "0.0.0.0:9100"
      QR_MIGRATE: "0"
      QR_MODEL_URL: "http://model:8080"
      QR_OBJECT_BUCKET: "quantrule"
      QR_OBJECT_STORE_ACCESS_KEY_FILE: "/run/secrets/object_store_access_key"
      QR_OBJECT_STORE_SECRET_KEY_FILE: "/run/secrets/object_store_secret_key"
      QR_OBJECT_STORE_TLS_CA_PATH: "/run/quantrule/pki/object-store-ca.crt"
      QR_OBJECT_STORE_URL: "https://minio:9000"
      QR_PROFILE: "server"
      QR_QUEUE_GENERATION: "1"
      QR_QUEUE_TLS_CA_PATH: "/run/quantrule/pki/queue-ca.crt"
      QR_QUEUE_URL_FILE: "/run/secrets/queue_url"
    healthcheck:
      interval: "15s"
      retries: 6
      start_period: "60s"
      test:
        -
          "CMD-SHELL"
        -
          "curl -fsS http://$$(hostname -i):9100/health | grep -q '\"state\":\"healthy\"'"
      timeout: "5s"
    image: "ghcr.io/quant-rule/quantrule-platform@sha256:cdace4a996c06cd6142fb63eb23a52136c071d9450fe0e07f5556fc26b9edabe"
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "50m"
    networks:
      -
        "quantrule"
    secrets:
      -
        gid: "10001"
        mode: 256
        source: "object_store_access_key"
        target: "object_store_access_key"
        uid: "10001"
      -
        gid: "10001"
        mode: 256
        source: "object_store_secret_key"
        target: "object_store_secret_key"
        uid: "10001"
      -
        gid: "10001"
        mode: 256
        source: "queue_url"
        target: "queue_url"
        uid: "10001"
    stop_grace_period: "40s"
  data:
    command:
      -
        "qr-data"
    configs:
