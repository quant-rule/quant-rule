# Generated by qr-deploy; copy to /etc/pgbackrest/pgbackrest.conf.
# The passphrase and S3 credentials are read from mode-600 files by the
# container command; this file carries no secret and no command line.
# One stanza covers all four logical databases of the one Patroni cluster.
# image: ghcr.io/quant-rule/patroni-pgbackrest (derived; pgBackRest is not in the base image)
[global]
backup-standby=y
log-level-console=info
log-level-file=detail
repo1-cipher-type=aes-256-cbc
repo1-path=/quantrule
repo1-retention-diff=7
repo1-retention-full=30
repo1-retention-full-type=time
repo1-s3-bucket=quantrule-backup
repo1-s3-endpoint=s3.example.internal:443
repo1-s3-region=us-east-1
repo1-s3-uri-style=path
repo1-storage-ca-file=/etc/quantrule/pki/ca.crt
repo1-storage-verify-tls=y
start-fast=y

[quantrule]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-socket-path=/run/postgresql

