# Generated by qr-deploy; copy to /etc/quantrule/haproxy/haproxy.cfg.
# TCP passthrough: HAProxy never terminates the database or broker TLS session.
# The unit reads patroni_rest_password and replaces the check header.
global
  log stdout format raw local0
  stats socket /tmp/haproxy.sock mode 600 level admin
  maxconn 2048

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 5s
  timeout client 30m
  timeout server 30m
  timeout check 5s
  default-server inter 2s fastinter 1s downinter 2s fall 3 rise 2

frontend postgres
  bind *:5432
  mode tcp
  option tcplog
  default_backend postgres_primary

backend postgres_primary
  mode tcp
  balance roundrobin
  option httpchk GET /primary
  http-check expect status 200
  http-check send hdr Authorization "Basic __PATRONI_REST_AUTH__"
  server patroni-lab-1 patroni-lab-1:5432 check port 8008
  server patroni-lab-2 patroni-lab-2:5432 check port 8008
  server patroni-lab-3 patroni-lab-3:5432 check port 8008
  on-marked-down shutdown-sessions

frontend rabbitmq
  bind *:5671
  mode tcp
  option tcplog
  default_backend rabbitmq_nodes

backend rabbitmq_nodes
  mode tcp
  balance roundrobin
  option tcp-check
  tcp-check connect
  server rabbitmq-lab-1 rabbitmq-lab-1:5671 check
  server rabbitmq-lab-2 rabbitmq-lab-2:5671 check
  server rabbitmq-lab-3 rabbitmq-lab-3:5671 check
  on-marked-down shutdown-sessions

listen stats
  mode http
  bind 0.0.0.0:8404
  stats enable
  stats uri /stats
  stats refresh 10s
