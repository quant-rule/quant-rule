name: "quantrule-infra-lab-1"
networks:
  quantrule:
    external: true
    name: "quantrule"
services:
  blackbox:
    command:
      -
        "--config.file=/etc/blackbox/blackbox.yml"
    container_name: "quantrule-blackbox"
    healthcheck:
      interval: "15s"
      retries: 5
      start_period: "60s"
      test:
        -
          "CMD-SHELL"
        -
          "wget -q -O /dev/null http://127.0.0.1:9115/"
      timeout: "5s"
    image: "prom/blackbox-exporter@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13"
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "50m"
    networks:
      quantrule:
        aliases:
          -
            "blackbox"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: true
        source: "/etc/quantrule/blackbox/blackbox.yml"
        target: "/etc/blackbox/blackbox.yml"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/ca.crt"
        target: "/etc/quantrule/pki/ca.crt"
        type: "bind"
  etcd:
    command:
      -
        "etcd"
      -
        "--config-file"
      -
        "/etc/etcd/etcd.conf.yml"
    container_name: "quantrule-etcd-lab-1"
    image: "quay.io/coreos/etcd@sha256:316f5d367455f75a327f9dc72f669cbf645651859fa2e272f692a1f2dee6f5c9"
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "50m"
    networks:
      quantrule:
        aliases:
          -
            "etcd-lab-1"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: false
        source: "/srv/quantrule/etcd/data"
        target: "/etcd-data"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/etcd/etcd.conf.yml"
        target: "/etc/etcd/etcd.conf.yml"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/ca.crt"
        target: "/etc/quantrule/pki/ca.crt"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/etcd"
        target: "/etc/quantrule/pki/etcd"
        type: "bind"
  grafana:
    container_name: "quantrule-grafana"
    environment:
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_SERVER_HTTP_PORT: "3000"
      GF_USERS_ALLOW_SIGN_UP: "false"
    healthcheck:
      interval: "15s"
      retries: 5
      start_period: "60s"
      test:
        -
          "CMD-SHELL"
        -
          "wget -q -O /dev/null http://127.0.0.1:3000/api/health"
      timeout: "5s"
    image: "grafana/grafana@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf"
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "50m"
    networks:
      quantrule:
        aliases:
          -
            "grafana"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: false
        source: "/srv/quantrule/grafana/data"
        target: "/var/lib/grafana"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/grafana/provisioning"
        target: "/etc/grafana/provisioning"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/grafana/dashboards"
        target: "/etc/grafana/dashboards"
        type: "bind"
  haproxy:
    command:
      -
        "/bin/sh"
      -
        "-c"
      -
        "set -eu\numask 077\nauth=\"patroni:$$(cat /run/secrets/patroni_rest_password)\"\nencoded=$$(printf '%s' \"$$auth\" | base64 | tr -d '\\n')\nsed \"s|__PATRONI_REST_AUTH__|$$encoded|g\" /usr/local/etc/haproxy/haproxy.cfg > /tmp/haproxy.cfg\nexec haproxy -W -db -f /tmp/haproxy.cfg"
    container_name: "quantrule-haproxy-lab-1"
    image: "haproxy@sha256:8ab12982db911f3f13e53c8e4c11312f65b8367301787acbab86459cddf288ea"
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "50m"
    networks:
      quantrule:
        aliases:
          -
            "haproxy-lab-1"
          -
            "postgres"
          -
            "rabbitmq"
          -
            "minio"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: true
        source: "/etc/quantrule/haproxy/haproxy.cfg"
        target: "/usr/local/etc/haproxy/haproxy.cfg"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/patroni_rest_password"
        target: "/run/secrets/patroni_rest_password"
        type: "bind"
  keepalived:
    cap_add:
      -
        "NET_ADMIN"
      -
        "NET_BROADCAST"
    container_name: "quantrule-keepalived-lab-1"
    image: "osixia/keepalived@sha256:4bf02d569ed240e6da272242b368ce5a25cf0f7d92114536367ee2c963c318a2"
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "50m"
    network_mode: "host"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: true
        source: "/etc/quantrule/keepalived.conf"
        target: "/etc/keepalived/keepalived.conf"
        type: "bind"
  minio-lab-1:
    command:
      -
        "/bin/sh"
      -
        "-c"
      -
        "set -eu\numask 077\nexport MINIO_ROOT_USER=\"$$(cat /run/secrets/minio_root_user)\"\nexport MINIO_ROOT_PASSWORD=\"$$(cat /run/secrets/minio_root_password)\"\n. /etc/minio/minio.conf\nexec minio server --certs-dir /certs"
    container_name: "quantrule-minio-lab-1"
    environment:
      MINIO_BROWSER: "off"
      MINIO_CONFIG_ENV_FILE: "/etc/minio/minio.conf"
      MINIO_ROOT_PASSWORD_FILE: "/run/secrets/minio_root_password"
      MINIO_ROOT_USER_FILE: "/run/secrets/minio_root_user"
      MINIO_SERVER_URL: "https://minio:9000"
    hostname: "minio-lab-1"
    image: "minio/minio@sha256:bdf0781acceb93983c15eec9e56bfbd59dcadc98ea57467022d61aeee074a2cc"
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "50m"
    networks:
      quantrule:
        aliases:
          -
            "minio-lab-1"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: false
        source: "/srv/quantrule/minio/lab-1/drive1"
        target: "/data1"
        type: "bind"
      -
        read_only: false
        source: "/srv/quantrule/minio/lab-1/drive2"
        target: "/data2"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/minio/minio.conf"
        target: "/etc/minio/minio.conf"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/minio"
        target: "/certs"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/minio_root_user"
        target: "/run/secrets/minio_root_user"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/minio_root_password"
        target: "/run/secrets/minio_root_password"
        type: "bind"
  node-exporter-lab-1:
    command:
      -
        "--path.rootfs=/host"
      -
        "--collector.textfile.directory=/var/lib/node_exporter/textfile"
      -
        "--web.listen-address=0.0.0.0:9100"
    container_name: "quantrule-node-exporter-lab-1"
    healthcheck:
      interval: "15s"
      retries: 5
      start_period: "60s"
      test:
        -
          "CMD-SHELL"
        -
          "wget -q -O /dev/null http://127.0.0.1:9100/metrics"
      timeout: "5s"
    image: "prom/node-exporter@sha256:7296504d4ada44b7d7ab4431e27e9f9900d8488f8d55842f4b12ae2704e16dfe"
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "50m"
    networks:
      quantrule:
        aliases:
          -
            "node-lab-1"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        bind:
          propagation: "rslave"
        read_only: true
        source: "/"
        target: "/host"
        type: "bind"
      -
        read_only: true
        source: "/srv/quantrule/node_exporter/textfile"
        target: "/var/lib/node_exporter/textfile"
        type: "bind"
  patroni:
    command:
      -
        "/bin/sh"
      -
        "-c"
      -
        "set -eu\numask 077\nexport PATRONI_SUPERUSER_PASSWORD=\"$$(cat /run/secrets/postgres_superuser_password)\"\nexport PATRONI_REPLICATION_PASSWORD=\"$$(cat /run/secrets/patroni_replication_password)\"\nexport PATRONI_REWIND_PASSWORD=\"$$(cat /run/secrets/patroni_rewind_password)\"\nexport PATRONI_RESTAPI_PASSWORD=\"$$(cat /run/secrets/patroni_rest_password)\"\nif [ -f /run/secrets/pgbackrest_cipher_pass ]; then\nexport PGBACKREST_REPO1_CIPHER_PASS=\"$$(cat /run/secrets/pgbackrest_cipher_pass)\"\nfi\nif [ -f /run/secrets/pgbackrest_s3_access_key ]; then\nexport PGBACKREST_REPO1_S3_KEY=\"$$(cat /run/secrets/pgbackrest_s3_access_key)\"\nexport PGBACKREST_REPO1_S3_KEY_SECRET=\"$$(cat /run/secrets/pgbackrest_s3_secret_key)\"\nfi\nexec patroni /etc/patroni/patroni.yml"
    container_name: "quantrule-patroni-lab-1"
    image: "ghcr.io/quant-rule/patroni-pgbackrest@sha256:ffbf6f5298ec083505b31ebe962c70c32d791050d21c328a401f31c1cbe927a5"
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "50m"
    networks:
      quantrule:
        aliases:
          -
            "patroni-lab-1"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    volumes:
      -
        read_only: false
        source: "/srv/quantrule/patroni/data"
        target: "/var/lib/postgresql/data"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/patroni/patroni.yml"
        target: "/etc/patroni/patroni.yml"
        type: "bind"
      -
        read_only: true
        source: "/etc/pgbackrest/pgbackrest.conf"
        target: "/etc/pgbackrest/pgbackrest.conf"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/ca.crt"
        target: "/etc/quantrule/pki/ca.crt"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/postgres"
        target: "/etc/quantrule/pki/postgres"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/etcd"
        target: "/etc/quantrule/pki/etcd"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/postgres_superuser_password"
        target: "/run/secrets/postgres_superuser_password"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/patroni_replication_password"
        target: "/run/secrets/patroni_replication_password"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/patroni_rewind_password"
        target: "/run/secrets/patroni_rewind_password"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/patroni_rest_password"
        target: "/run/secrets/patroni_rest_password"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/rabbitmq_erlang_cookie"
        target: "/run/secrets/rabbitmq_erlang_cookie"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/pgbackrest_cipher_pass"
        target: "/run/secrets/pgbackrest_cipher_pass"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/pgbackrest_s3_access_key"
        target: "/run/secrets/pgbackrest_s3_access_key"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/pgbackrest_s3_secret_key"
        target: "/run/secrets/pgbackrest_s3_secret_key"
        type: "bind"
  prometheus:
    command:
      -
        "--config.file=/etc/prometheus/prometheus.yml"
      -
        "--storage.tsdb.path=/prometheus"
      -
        "--storage.tsdb.retention.time=30d"
      -
        "--storage.tsdb.retention.size=20GB"
      -
        "--web.listen-address=0.0.0.0:9090"
    container_name: "quantrule-prometheus"
    healthcheck:
      interval: "15s"
      retries: 5
      start_period: "60s"
      test:
        -
          "CMD-SHELL"
        -
          "wget -q -O /dev/null http://127.0.0.1:9090/-/ready"
      timeout: "5s"
    image: "prom/prometheus@sha256:1f0f50f06acaceb0f5670d2c8a658a599affe7b0d8e78b898c1035653849a702"
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "50m"
    networks:
      quantrule:
        aliases:
          -
            "prometheus"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    user: "0:0"
    volumes:
      -
        read_only: false
        source: "/srv/quantrule/prometheus/data"
        target: "/prometheus"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/prometheus/prometheus.yml"
        target: "/etc/prometheus/prometheus.yml"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/prometheus/alert-rules.yml"
        target: "/etc/prometheus/alert-rules.yml"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/ca.crt"
        target: "/etc/quantrule/pki/ca.crt"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/secrets/patroni_rest_password"
        target: "/etc/prometheus/secrets/patroni_rest_password"
        type: "bind"
  promtail-lab-1:
    command:
      -
        "-config.file=/etc/promtail/promtail.yml"
    container_name: "quantrule-promtail-lab-1"
    healthcheck:
      interval: "15s"
      retries: 5
      start_period: "60s"
      test:
        -
          "CMD-SHELL"
        -
          "wget -q -O /dev/null http://127.0.0.1:9080/ready"
      timeout: "5s"
    image: "grafana/promtail@sha256:a761cb834cfaeee29745440d4884d6748f0a08d8f68928db1d707018c1dcfbe9"
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "50m"
    networks:
      quantrule:
        aliases:
          -
            "promtail-lab-1"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    user: "0:0"
    volumes:
      -
        read_only: true
        source: "/etc/quantrule/promtail/promtail-lab-1.yml"
        target: "/etc/promtail/promtail.yml"
        type: "bind"
      -
        read_only: true
        source: "/var/run/docker.sock"
        target: "/var/run/docker.sock"
        type: "bind"
      -
        read_only: false
        source: "/srv/quantrule/promtail"
        target: "/var/lib/promtail"
        type: "bind"
  rabbitmq-broker-lab-1:
    command:
      -
        "/bin/sh"
      -
        "-c"
      -
        "set -eu\numask 077\ninstall -d -o rabbitmq -g rabbitmq -m 700 /var/lib/rabbitmq/pki\ninstall -o rabbitmq -g rabbitmq -m 600 /etc/quantrule/rabbitmq/erlang.cookie /var/lib/rabbitmq/.erlang.cookie\ninstall -o rabbitmq -g rabbitmq -m 600 /etc/quantrule/rabbitmq/rabbitmq.conf /var/lib/rabbitmq/rabbitmq.conf\ninstall -o rabbitmq -g rabbitmq -m 600 /etc/quantrule/rabbitmq/enabled_plugins /var/lib/rabbitmq/enabled_plugins\ninstall -o rabbitmq -g rabbitmq -m 644 /etc/quantrule/pki/rabbitmq/ca.crt /var/lib/rabbitmq/pki/ca.crt\ninstall -o rabbitmq -g rabbitmq -m 644 /etc/quantrule/pki/rabbitmq/server.crt /var/lib/rabbitmq/pki/server.crt\ninstall -o rabbitmq -g rabbitmq -m 600 /etc/quantrule/pki/rabbitmq/server.key /var/lib/rabbitmq/pki/server.key\nchown -R rabbitmq:rabbitmq /var/lib/rabbitmq /srv/quantrule/rabbitmq/definitions\nexport RABBITMQ_CONFIG_FILE=/var/lib/rabbitmq/rabbitmq.conf\nexport RABBITMQ_ENABLED_PLUGINS_FILE=/var/lib/rabbitmq/enabled_plugins\nexec gosu rabbitmq rabbitmq-server"
    container_name: "quantrule-rabbitmq-lab-1"
    environment:
      RABBITMQ_CONFIG_FILE: "/var/lib/rabbitmq/rabbitmq.conf"
      RABBITMQ_ENABLED_PLUGINS_FILE: "/var/lib/rabbitmq/enabled_plugins"
      RABBITMQ_NODENAME: "rabbit@rabbitmq-lab-1"
    hostname: "rabbitmq-lab-1"
    image: "rabbitmq@sha256:183272aa2ff82718cabeef343de8d9a900931ea65fda4e563fed2a6d9efde578"
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "50m"
    networks:
      quantrule:
        aliases:
          -
            "rabbitmq-lab-1"
    restart: "unless-stopped"
    stop_grace_period: "40s"
    user: "0:0"
    volumes:
      -
        read_only: false
        source: "/srv/quantrule/rabbitmq/data"
        target: "/var/lib/rabbitmq"
        type: "bind"
      -
        read_only: false
        source: "/srv/quantrule/rabbitmq/definitions"
        target: "/srv/quantrule/rabbitmq/definitions"
        type: "bind"
      -
        read_only: true
        source: "/srv/quantrule/rabbitmq/conf.d"
        target: "/etc/rabbitmq/conf.d"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/rabbitmq/rabbitmq.conf"
        target: "/etc/rabbitmq/rabbitmq.conf"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/rabbitmq/enabled_plugins"
        target: "/etc/rabbitmq/enabled_plugins"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/rabbitmq/erlang.cookie"
        target: "/etc/quantrule/rabbitmq/erlang.cookie"
        type: "bind"
      -
        read_only: true
        source: "/etc/quantrule/pki/rabbitmq"
        target: "/etc/quantrule/pki/rabbitmq"
        type: "bind"
x-quantrule:
  evidence: "Simulated HA"
  network: "overlay, attachable, encrypted; created by bootstrap.sh"
  owner: "PLAT-003/PLAT-004/PLAT-005/PLAT-006"
  platform: "keepalived is PLAT-002; Patroni, etcd, and HAProxy are configured by PLAT-003; RabbitMQ is PLAT-004; MinIO is PLAT-005; Prometheus, Alertmanager, Loki, Grafana, blackbox, node_exporter, and promtail are PLAT-006"
  profile: "lab-single-host"
