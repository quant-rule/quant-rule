# Generated by qr-deploy for lab-1; copy to /etc/quantrule/keepalived.conf.
# The pinned image must provide keepalived and a BusyBox-style `nc`.
vrrp_script chk_traefik {
    script "nc -z 127.0.0.1 443"
    interval 1
    timeout 1
    fall 3
    rise 2
}

vrrp_instance VI_1 {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 101
    advert_int 1
    unicast_src_ip 10.10.0.11
    unicast_peer {
        10.10.0.12
    }
    virtual_ipaddress {
        10.10.0.20/32 dev eth0
    }
    track_script {
        chk_traefik
    }
}
