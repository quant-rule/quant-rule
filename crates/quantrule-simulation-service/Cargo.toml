[package]
name = "quantrule-simulation-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The QuantRule simulation service: the hindsight research plane"
license = "MIT"
publish = false

[[bin]]
name = "qr-simulation"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
quantrule-api = { path = "../quantrule-api" }
quantrule-runtime = { path = "../quantrule-runtime" }
quantrule-simulation = { path = "../quantrule-simulation" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-ring-native-roots"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
