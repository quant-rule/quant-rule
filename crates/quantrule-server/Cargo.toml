[package]
name = "quantrule-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The QuantRule services: gateway routes, the backtest worker, and evidence"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "qr-gateway"
path = "src/bin/qr_gateway.rs"

[[bin]]
name = "qr-backtest"
path = "src/bin/qr_backtest.rs"

[[bin]]
name = "qr-evidence"
path = "src/bin/qr_evidence.rs"

[dependencies]
axum = "0.8.9"
quantrule-api = { path = "../quantrule-api" }
quantrule-app = { path = "../quantrule-app" }
quantrule-data = { path = "../quantrule-data" }
quantrule-model = { path = "../quantrule-model" }
quantrule-research = { path = "../quantrule-research" }
quantrule-runtime = { path = "../quantrule-runtime" }
quantrule-service-api = { path = "../quantrule-service-api" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "fs", "time"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
futures-util = "0.3"
tower = { version = "0.5.3", features = ["util"] }
