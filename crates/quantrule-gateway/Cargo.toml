[package]
name = "quantrule-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The QuantRule gateway: profiles, static client, proxy surface, and health"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "qr-gateway"
path = "src/bin/qr_gateway.rs"

[dependencies]
axum = "0.8.9"
quantrule-api = { path = "../quantrule-api" }
quantrule-runtime = { path = "../quantrule-runtime" }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "fs", "time"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
futures-util = "0.3"
quantrule-service-api = { path = "../quantrule-service-api" }
tower = { version = "0.5.3", features = ["util"] }
