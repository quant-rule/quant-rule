[package]
name = "quantrule-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The QuantRule service runtime: configuration, health, storage, queue, migrations, and shutdown"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
aws-config = "1.13.2"
aws-sdk-s3 = "1.159.0"
axum = "0.8.9"
futures-util = "0.3"
lapin = "4.12.3"
quantrule-api = { path = "../quantrule-api" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "fs", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

[lints]
workspace = true
