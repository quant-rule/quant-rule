[package]
name = "quantrule-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The QuantRule service runtime: configuration, health, storage, queue, migrations, and shutdown"
license = "MIT"
publish = false

[dependencies]
aws-sdk-s3 = { version = "1.159.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-smithy-http-client = { version = "1.5", features = ["rustls-aws-lc", "rt-tokio"] }
axum = "0.8.9"
bytes = "1.12.1"
futures-util = "0.3"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "tokio"] }
lapin = "4.12.3"
quantrule-api = { path = "../quantrule-api" }
quantrule-service-api = { path = "../quantrule-service-api" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-ring-native-roots"] }
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "fs", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "json"] }

[dev-dependencies]
rcgen = "0.14"
tokio = { version = "1.54.1", features = ["test-util", "macros", "rt-multi-thread", "time", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
