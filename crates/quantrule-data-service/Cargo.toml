[package]
name = "quantrule-data-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The QuantRule data service: catalog, datasets, configs, and inspection"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "qr-data"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
futures-util = "0.3"
quantrule-api = { path = "../quantrule-api" }
quantrule-app = { path = "../quantrule-app" }
quantrule-data = { path = "../quantrule-data" }
quantrule-runtime = { path = "../quantrule-runtime" }
quantrule-service-api = { path = "../quantrule-service-api" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-ring-native-roots"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
