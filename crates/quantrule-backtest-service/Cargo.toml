[package]
name = "quantrule-backtest-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The QuantRule backtest service: worker orchestration, strategy, execution, and portfolio"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "qr-backtest"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
quantrule-api = { path = "../quantrule-api" }
quantrule-app = { path = "../quantrule-app" }
quantrule-data = { path = "../quantrule-data" }
quantrule-runtime = { path = "../quantrule-runtime" }
quantrule-service-api = { path = "../quantrule-service-api" }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "fs", "time"] }
tracing = "0.1.44"

[lints]
workspace = true
