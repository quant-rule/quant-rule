[workspace]
members = [
    "crates/quantrule-api",
    "crates/quantrule-research",
    "crates/quantrule-simulation",
    "crates/quantrule-simulation-service",
    "crates/quantrule-app",
    "crates/quantrule-backtest",
    "crates/quantrule-backtest-service",
    "crates/quantrule-data",
    "crates/quantrule-data-service",
    "crates/quantrule-deploy",
    "crates/quantrule-evidence-service",
    "crates/quantrule-gateway",
    "crates/quantrule-governance",
    "crates/quantrule-model",
    "crates/quantrule-model-service",
    "crates/quantrule-runtime",
    "crates/quantrule-service-api",
    "crates/quantrule-shell",
]
resolver = "3"

[workspace.package]
version = "1.5.2"
edition = "2024"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
