[workspace]
members = [
    "crates/quantrule-api",
    "crates/quantrule-research",
    "crates/quantrule-simulation",
    "crates/quantrule-app",
    "crates/quantrule-backtest",
    "crates/quantrule-data",
    "crates/quantrule-model",
    "crates/quantrule-server",
    "crates/quantrule-shell",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
