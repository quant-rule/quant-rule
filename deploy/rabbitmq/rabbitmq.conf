# QuantRule broker TLS.
#
# Only the TLS AMQP listener is exposed. The plaintext AMQP listener stays off;
# the management (15672) and Prometheus (15692) HTTP listeners are overlay-only,
# have no host port, and are covered by the S-05 accepted risk. The internal
# healthcheck uses the local Erlang node, not a network port. The certificate
# files are copied into the broker's named volume by the one-shot pki-init
# container, so the private key stays 0600 and owned by the rabbitmq UID.
listeners.tcp = none
listeners.ssl.default = 5671

ssl_options.cacertfile = /var/lib/rabbitmq/pki/ca.crt
ssl_options.certfile = /var/lib/rabbitmq/pki/server.crt
ssl_options.keyfile = /var/lib/rabbitmq/pki/server.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.2
ssl_options.versions.2 = tlsv1.3
