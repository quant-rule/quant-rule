# The release pipeline: one image digest, two desktop artifacts, one record.
#
# A pushed v* tag builds and verifies the image, pushes it to the registry,
# records its digest, builds the Linux AppImage and the Windows NSIS installer,
# and attaches all three to the GitHub release.
#
# The default registry is GHCR and the default image is
# ghcr.io/<owner>/quantrule-platform, authenticated with the workflow's
# GITHUB_TOKEN and the job-level `packages: write` permission. QR_REGISTRY,
# QR_IMAGE_NAME, QR_REGISTRY_USERNAME, and QR_REGISTRY_TOKEN remain optional
# overrides for another registry; a custom registry needs its own token. The tag
# gate requires the annotated v* tag, main ancestry, and the release note, not a
# set of repository values, because the default needs none.
#
# workflow_dispatch with publish_snapshot=true pushes a snapshot-<sha> image and
# records its digest without creating a release. That is the pre-tag GHCR proof.
# A workflow_dispatch without it builds the image locally and records a local
# image ID.
#
# workflow_dispatch with release_tag=<vX.Y.Z> is the manual recovery path: it
# checks out the existing tag, re-runs every gate and build, pushes the version
# tag to the registry, and creates or updates the GitHub release. It never
# creates, moves, or deletes a tag (`gh release create --verify-tag`). The two
# dispatch inputs are mutually exclusive.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_snapshot:
        description: "Push a snapshot-<sha> image to GHCR and record its digest; no release"
        type: boolean
        default: false
      release_tag:
        description: "Existing annotated vX.Y.Z tag to release (manual recovery); no new tag"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # A tag push and a manual recovery for the same tag share one group.
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  LOCAL_IMAGE: quantrule-server:release-${{ github.sha }}
  # GHCR requires a lowercase repository path, so the resolver lowercases the
  # owner. Some owners are mixed case; the image name is not.
  DEFAULT_REGISTRY: ghcr.io
  DEFAULT_IMAGE_NAME: ${{ github.repository_owner }}/quantrule-platform

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - name: Reject conflicting dispatch inputs
        if: github.event_name == 'workflow_dispatch' && inputs.publish_snapshot && inputs.release_tag != ''
        run: |
          echo "::error::publish_snapshot and release_tag are mutually exclusive" >&2
          exit 1

      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify the release tag
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          tag="${RELEASE_TAG_INPUT:-$GITHUB_REF_NAME}"
          printf 'release tag: %s\n' "$tag"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$tag is not a vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          # actions/checkout fetches a tag push as `+<commit>:refs/tags/<tag>`
          # with --no-tags, which leaves a lightweight ref. Re-fetch the tag
          # objects before asking for the object type; a lightweight tag is a
          # defect the gate must still refuse.
          git fetch --tags --force origin
          if [ "$(git cat-file -t "refs/tags/$tag" 2>/dev/null || true)" != tag ]; then
            echo "::error::$tag is not an annotated tag" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "refs/tags/$tag^{commit}" origin/main; then
            echo "::error::$tag is not on main" >&2
            exit 1
          fi
          note="$(find docs/releases -type f -name "$tag.md" -print -quit)"
          if [ -z "$note" ]; then
            echo "::error::missing release note docs/releases/<YYYY-MM-DD>/$tag.md" >&2
            exit 1
          fi
          echo "$tag is annotated, on main, and has $note"

      - name: Install the pinned toolchain
        run: rustup show

      - name: Workspace gate
        run: tools/gate.sh

  image:
    name: Image and digest
    needs: gate
    runs-on: ubuntu-latest
    # Pushing to GHCR with GITHUB_TOKEN needs packages: write on this job only.
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      image: ${{ steps.reference.outputs.image }}
      ref: ${{ steps.reference.outputs.ref }}
      tag: ${{ steps.reference.outputs.tag }}
      source: ${{ steps.digest.outputs.source }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Resolve the image reference
        id: reference
        env:
          QR_REGISTRY: ${{ vars.QR_REGISTRY }}
          QR_IMAGE_NAME: ${{ vars.QR_IMAGE_NAME }}
          QR_REGISTRY_USERNAME: ${{ secrets.QR_REGISTRY_USERNAME }}
          QR_REGISTRY_TOKEN: ${{ secrets.QR_REGISTRY_TOKEN }}
          PUBLISH_SNAPSHOT: ${{ inputs.publish_snapshot }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          registry="${QR_REGISTRY:-$DEFAULT_REGISTRY}"
          default_name="$(printf '%s' "$DEFAULT_IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          name="${QR_IMAGE_NAME:-$default_name}"
          image="$registry/$name"
          if [ -n "$QR_REGISTRY" ] && [ -z "$QR_REGISTRY_TOKEN" ]; then
            echo "::error::QR_REGISTRY overrides the GHCR default, so QR_REGISTRY_TOKEN and QR_REGISTRY_USERNAME are required; see docs/releases/README.md" >&2
            exit 1
          fi
          if [ -n "$QR_REGISTRY_TOKEN" ] && [ -z "$QR_REGISTRY_USERNAME" ]; then
            echo "::error::QR_REGISTRY_TOKEN is set without QR_REGISTRY_USERNAME" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
            publish=true
            source="the version tag"
          elif [ -n "$RELEASE_TAG_INPUT" ]; then
            tag="$RELEASE_TAG_INPUT"
            publish=true
            source="the manual release dispatch"
          elif [ "$PUBLISH_SNAPSHOT" = "true" ]; then
            tag="snapshot-$GITHUB_SHA"
            publish=true
            source="the snapshot dispatch"
          else
            tag=""
            publish=false
            source="a local build"
          fi
          {
            echo "registry=$registry"
            echo "image=$image"
            echo "tag=$tag"
            echo "publish=$publish"
            echo "source=$source"
          } >> "$GITHUB_OUTPUT"
          if [ "$publish" = "true" ]; then
            echo "ref=$image:$tag" >> "$GITHUB_OUTPUT"
            {
              echo "## Image"
              echo
              echo "- Reference: \`$image:$tag\`"
              echo "- Built from: $source"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ref=$LOCAL_IMAGE" >> "$GITHUB_OUTPUT"
            {
              echo "## Image"
              echo
              echo "This is a local build. The recorded digest is a local image ID and"
              echo "no image was pushed. Set publish_snapshot to push one."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Log in to the image registry
        if: steps.reference.outputs.publish == 'true'
        env:
          REGISTRY: ${{ steps.reference.outputs.registry }}
          REGISTRY_USERNAME: ${{ secrets.QR_REGISTRY_USERNAME || github.actor }}
          REGISTRY_TOKEN: ${{ secrets.QR_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" \
            | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin

      - name: Build the image
        env:
          IMAGE: ${{ steps.reference.outputs.image }}
          REF: ${{ steps.reference.outputs.ref }}
          PUBLISH: ${{ steps.reference.outputs.publish }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            # The checked-out commit is the tag commit on a tag push and on a
            # manual release dispatch, so the sha tag names what was built.
            sha_tag="sha-$(git rev-parse HEAD)"
            docker build \
              --platform linux/amd64 \
              --tag "$REF" \
              --tag "$IMAGE:$sha_tag" \
              .
            docker push "$REF"
            docker push "$IMAGE:$sha_tag"
          else
            docker build --platform linux/amd64 --tag "$REF" .
          fi

      - name: Assert the image carries no Python
        env:
          REF: ${{ steps.reference.outputs.ref }}
        run: docker run --rm "$REF" /usr/local/bin/check-no-python

      - name: Check the image contract
        env:
          REF: ${{ steps.reference.outputs.ref }}
        run: |
          version="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
          reported="$(docker run --rm "$REF" --version | awk '{print $2}')"
          if [ "$reported" != "$version" ]; then
            echo "::error::the image reports $reported, Cargo.toml says $version" >&2
            exit 1
          fi
          if docker run --rm "$REF" sh -c 'command -v python3 || command -v bun'; then
            echo "::error::the image carries a Python or Bun interpreter" >&2
            exit 1
          fi
          echo "the image reports quantrule-server $reported"

      - name: Capture the image digest
        id: digest
        env:
          REF: ${{ steps.reference.outputs.ref }}
          PUBLISH: ${{ steps.reference.outputs.publish }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            digest="$(docker buildx imagetools inspect "$REF" \
              --format '{{.Manifest.Digest}}')"
            source=registry
          else
            digest="$(docker image inspect "$REF" --format '{{.Id}}')"
            source=local
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          {
            echo "- Digest: \`$digest\`"
            echo "- Digest source: $source"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the digest in /health
        env:
          IMAGE: ${{ steps.reference.outputs.ref }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          QR_IMAGE="$IMAGE" QR_IMAGE_DIGEST="$DIGEST" \
            docker compose up -d --wait --no-build
          trap 'docker compose down --volumes --remove-orphans' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health -o health.json; then
              break
            fi
            echo "the gateway is not answering yet (attempt $attempt of 20)"
            sleep 3
          done
          cat health.json
          reported="$(jq -r '.image_digest // empty' health.json)"
          if [ "$reported" != "$DIGEST" ]; then
            echo "::error::/health reports $reported, expected $DIGEST" >&2
            exit 1
          fi
          expected_version="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
          product="$(curl -fsS http://127.0.0.1:8080/version | jq -r '.product')"
          if [ "$product" != "$expected_version" ]; then
            echo "::error::/version reports $product, expected $expected_version" >&2
            exit 1
          fi
          echo "/health reports $DIGEST; /version reports $product"
          docker compose ps
          running="$(docker compose ps --status running --services | wc -l)"
          if [ "$running" -ne 9 ]; then
            echo "::error::the default stack started $running containers, expected 9" >&2
            exit 1
          fi

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: appimage
            name: quantrule-desktop-linux
            path: apps/desktop-shell/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            bundle: nsis
            name: quantrule-desktop-windows
            path: apps/desktop-shell/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install the pinned toolchain
        run: rustup show

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install the Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file patchelf \
            libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev xvfb dbus-x11

      - name: Test the shell helpers
        working-directory: apps/desktop-shell
        run: bun test

      - name: Check the shell boundary
        working-directory: apps/desktop-shell
        run: bash tests/boundary.sh

      - name: Test the desktop supervisor
        working-directory: apps/desktop-shell/supervisor
        run: cargo test

      - name: Build the six service sidecars
        # The sidecars are built from the same commit as the image and the
        # shell. They are not rebuilt from a different tree, and no service is
        # sourced from a previous release.
        run: |
          cargo build --release --locked \
            --bin qr-gateway --bin qr-data --bin qr-model \
            --bin qr-backtest --bin qr-evidence --bin qr-simulation

      - name: Build the shell client
        # The packaged-profile smoke drives the HTTP contract through
        # tools/verify.sh, which needs the thin `quantrule` client. It is not
        # part of the desktop package.
        run: cargo build --release --locked --bin quantrule

      - name: Build the desktop supervisor
        working-directory: apps/desktop-shell/supervisor
        # The embedded profile makes a packaged supervisor start the sidecars.
        # A plain development build stays external and starts nothing.
        run: cargo build --release --features embedded-profile

      - name: Stage the packaged resources
        working-directory: apps/desktop-shell
        # Fails when any of the seven executables or the example configs is
        # missing, so an installer can never silently ship a partial package.
        run: |
          bun scripts/stage-package.mjs \
            --services-dir "$GITHUB_WORKSPACE/target/release" \
            --supervisor-bin "$GITHUB_WORKSPACE/apps/desktop-shell/supervisor/target/release"

      - name: Build the installer
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop-shell
          tauriScript: bunx @tauri-apps/cli@2
          includeUpdaterJson: false
          args: --bundles ${{ matrix.bundle }}

      - name: Check the installer contents
        shell: bash
        run: |
          if [ "${{ matrix.bundle }}" = "appimage" ]; then
            artifact="$(find apps/desktop-shell/target/release/bundle/appimage -maxdepth 1 -type f -name "*.AppImage" -print -quit)"
            bash apps/desktop-shell/tests/check-package.sh "$artifact"
          else
            artifact="$(find apps/desktop-shell/target/release/bundle/nsis -maxdepth 1 -type f -name "*-setup.exe" -print -quit)"
            powershell -NoProfile -ExecutionPolicy Bypass \
              -File apps/desktop-shell/tests/check-package.ps1 -Artifact "$artifact"
          fi

      - name: Smoke the packaged supervisor with stub sidecars
        if: runner.os == 'Linux'
        # The six real services need the embedded backends (#693/#694). This
        # replaces them with the test stub in a throwaway extraction and proves
        # the packaged supervisor, resource layout, health, and stop path. It
        # claims no run and no digest.
        run: |
          artifact="$(find apps/desktop-shell/target/release/bundle/appimage -maxdepth 1 -type f -name "*.AppImage" -print -quit)"
          bash apps/desktop-shell/tests/smoke-package-linux.sh "$artifact"

      - name: Smoke the packaged Linux profile through the fixture
        if: runner.os == 'Linux'
        # Package parity, not just package layout: the extracted AppImage's own
        # supervisor starts its own six sidecars, the fixture runs from the
        # staged config, and the canonical digest must match the server oracle.
        run: |
          artifact="$(find apps/desktop-shell/target/release/bundle/appimage -maxdepth 1 -type f -name "*.AppImage" -print -quit)"
          bash apps/desktop-shell/tests/smoke-package-parity-linux.sh \
            --shell-bin target/release/quantrule "$artifact"

      - name: Smoke the packaged Windows profile through the fixture
        if: runner.os == 'Windows'
        # Silent NSIS install, the installed supervisor's six sidecars, the
        # fixture from the installed config, and the same canonical digest.
        # QR_PYTHON names the host interpreter; the stock image does not expose
        # the versioned alias that tools/verify.sh defaults to.
        shell: pwsh
        env:
          QR_PYTHON: python
        run: |
          $artifact = Get-ChildItem apps/desktop-shell/target/release/bundle/nsis -Filter "*-setup.exe" -File |
            Select-Object -First 1
          if (-not $artifact) { throw "the NSIS bundle produced no installer" }
          & pwsh -NoProfile -ExecutionPolicy Bypass `
            -File apps/desktop-shell/tests/smoke-package-parity.ps1 `
            -Artifact $artifact.FullName `
            -Shell target/release/quantrule.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assert the artifact carries the product version
        env:
          BUNDLE: ${{ matrix.bundle }}
        # Git Bash on the Windows runner: the check is the same POSIX script.
        shell: bash
        run: |
          version="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
          if [ "$BUNDLE" = "appimage" ]; then
            artifact="$(find apps/desktop-shell/target/release/bundle/appimage -maxdepth 1 -type f -name "*.AppImage" -print -quit)"
          else
            artifact="$(find apps/desktop-shell/target/release/bundle/nsis -maxdepth 1 -type f -name "*-setup.exe" -print -quit)"
          fi
          if [ -z "$artifact" ]; then
            echo "::error::the $BUNDLE bundle produced no artifact" >&2
            exit 1
          fi
          case "$(basename "$artifact")" in
            *_"$version"_*) ;;
            *)
              echo "::error::$(basename "$artifact") does not name version $version" >&2
              exit 1
              ;;
          esac
          echo "$(basename "$artifact") names version $version"

      - name: Smoke test the Linux shell
        if: runner.os == 'Linux'
        working-directory: apps/desktop-shell
        run: |
          bin="$(find target/release -maxdepth 1 -type f -name quantrule-desktop-shell -print -quit)"
          bash tests/smoke-linux.sh "$bin"

      - name: Smoke test the Windows shell
        if: runner.os == 'Windows'
        working-directory: apps/desktop-shell
        shell: pwsh
        run: |
          $exe = "target\release\quantrule-desktop-shell.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $proc = Start-Process -FilePath (Resolve-Path $exe) -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) { throw "the shell exited with code $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force

      - name: Upload the installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  publish:
    name: Publish the release
    if: (github.event_name == 'push' || inputs.release_tag != '') && needs.image.outputs.source == 'registry'
    needs:
      - gate
      - image
      - desktop
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      # On a tag push this is the pushed tag; on the manual recovery dispatch it
      # is the existing tag. It never names a branch.
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Download the desktop assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: quantrule-desktop-*
          path: desktop
          merge-multiple: true

      - name: Build the release body
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
          SOURCE: ${{ needs.image.outputs.source }}
        run: |
          note="$(find docs/releases -type f -name "$RELEASE_TAG.md" -print -quit)"
          if [ -z "$note" ]; then
            echo "::error::missing release note docs/releases/<YYYY-MM-DD>/$RELEASE_TAG.md" >&2
            exit 1
          fi
          appimage="$(find desktop -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          installer="$(find desktop -maxdepth 1 -type f -name '*-setup.exe' -print -quit)"
          if [ -z "$appimage" ] || [ -z "$installer" ]; then
            echo "::error::both desktop artifacts must be present" >&2
            exit 1
          fi
          {
            cat "$note"
            echo
            echo "## Image and desktop artifacts"
            echo
            echo "- Image: \`$IMAGE\`"
            echo "- Image digest: \`$DIGEST\` ($SOURCE)"
            echo "- Linux AppImage: \`$(basename "$appimage")\`"
            echo "- Windows NSIS installer: \`$(basename "$installer")\`"
            echo
            echo "The desktop artifacts are unsigned. On Windows, SmartScreen"
            echo "shows \"Windows protected your PC\"; choose **More info**, then"
            echo "**Run anyway**. On Linux, mark the AppImage executable and run it."
          } > release-body.md
          cp release-body.md "$RUNNER_TEMP/release-body.md"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --verify-tag refuses to create a release for a tag that does not
          # exist, so this step can never create, move, or delete one. An
          # existing release for the same tag is updated, which makes a retry
          # idempotent instead of creating a second release.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG exists; updating its body and assets"
            gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-body.md"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-body.md"
          fi
          gh release upload "$RELEASE_TAG" \
            desktop/*.AppImage desktop/*-setup.exe --clobber

      - name: Verify the released record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          gh release view "$RELEASE_TAG" --json body,assets,url > release.json
          names="$(jq -r '.assets[].name' release.json)"
          if ! jq -e --arg digest "$DIGEST" '.body | contains($digest)' release.json >/dev/null; then
            echo "::error::the release body does not name the digest $DIGEST" >&2
            exit 1
          fi
          if ! printf '%s\n' "$names" | grep -q '\.AppImage$'; then
            echo "::error::the release has no AppImage asset: $names" >&2
            exit 1
          fi
          if ! printf '%s\n' "$names" | grep -q -- '-setup\.exe$'; then
            echo "::error::the release has no NSIS installer asset: $names" >&2
            exit 1
          fi
          jq -r '.url' release.json
          printf '%s\n' "$names"
          appimage="$(find desktop -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          installer="$(find desktop -maxdepth 1 -type f -name '*-setup.exe' -print -quit)"
          {
            echo "## Published"
            echo
            jq -r '.url' release.json
            echo
            echo "Copy these two lines into the release note:"
            echo
            echo "- Image digest: \`$DIGEST\`"
            echo "- Desktop artifacts: \`$(basename "$appimage")\`, \`$(basename "$installer")\`"
          } >> "$GITHUB_STEP_SUMMARY"
