# The quality gate for the Rust workspace.
#
# The toolchain is pinned by rust-toolchain.toml. The runner already has
# rustup, so `rustup show` installs the pinned toolchain and components.
# The Rust commands and the shared checker gate are the same ones documented in
# README.md and run by tools/gate.sh.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install the pinned toolchain
        run: rustup show

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Checker gate
        run: bash tools/checkers.sh

      - name: Project sync
        run: |
          bash -n .github/scripts/project-sync.sh
          bash tools/test_project_sync.sh

      - name: Data tooling
        run: |
          python3 -m py_compile tools/data/*.py
          python3 -m unittest discover -s tools/data -p 'test_*.py'

      - name: Tests
        run: cargo test

      # Historical tooling retained for reproducibility; not part of the current shell surface.
      - name: Historical improvement tooling
        run: |
          python3 -m py_compile tools/improvement/*.py tools/check_terms.py
          python3 -m unittest discover -s tools/improvement -p 'test_*.py'

      # Historical tooling retained for reproducibility; not part of the current shell surface.
      - name: Historical research tooling and coverage
        run: |
          python3 -m py_compile tools/research/*.py
          python3 -m unittest discover -s tools/research -p 'test_*.py'
          python3 tools/research/program.py --program config/research/PROGRAM-2026-11-05-03/program.json --check
          python3 tools/research/coverage.py --program config/research/PROGRAM-2026-11-05-03/program.json

      - name: Documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install the client dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build

  web-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install the client dependencies
        run: bun install --frozen-lockfile

      - name: Install the browser
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests
        run: bun run e2e
