# The quality gate for the Rust workspace.
#
# The toolchain is pinned by rust-toolchain.toml. The runner already has
# rustup, so `rustup show` installs the pinned toolchain and components.
# The Rust commands and the shared checker gate are the same ones documented in
# README.md and run by tools/gate.sh.
#
# The `plan-and-check` job classifies the pull request with
# `qr-governance gate plan`. The `rust` and web jobs run only when the mode
# needs them. The final `gate` job fails when a needed job failed or was wrongly
# skipped. Main pushes classify as full.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  plan_and_check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_TARGET_DIR: target/gate
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install the pinned toolchain
        run: rustup show

      - name: Cache the Rust dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2.9.3
        with:
          workspaces: ". -> target/gate"
          shared-key: "gate"
          add-job-id-key: false
          cache-targets: true
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Plan the gate scope
        id: plan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            mode="$(cargo run --quiet -p quantrule-governance -- gate plan --changed "$base...HEAD" --field mode)" || mode=full
          else
            mode=full
          fi
          case "$mode" in
            docs|governance|web|full) ;;
            *) mode=full ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "gate scope: $mode"

      - name: Checker gate
        run: cargo run --quiet -p quantrule-governance -- check --all

      - name: Project sync
        run: |
          bash -n .github/scripts/project-sync.sh
          bash tools/test_project_sync.sh

      - name: Compose parse
        run: |
          secrets="$RUNNER_TEMP/qr-secrets"
          bash tools/secrets.sh --out "$secrets"
          QR_SECRETS_DIR="$secrets" docker compose \
            --env-file "$secrets/compose.env" \
            -f compose.yaml -f compose.remote.yaml config -q

  rust:
    needs: plan_and_check
    if: needs.plan_and_check.outputs.mode == 'governance' || needs.plan_and_check.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_TARGET_DIR: target/gate
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install the pinned toolchain
        run: rustup show

      - name: Cache the Rust dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2.9.3
        with:
          workspaces: ". -> target/gate"
          shared-key: "gate"
          add-job-id-key: false
          cache-targets: true
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lints (governance)
        if: needs.plan_and_check.outputs.mode == 'governance'
        run: cargo clippy -p quantrule-governance --all-targets -- -D warnings

      - name: Lints (full)
        if: needs.plan_and_check.outputs.mode == 'full'
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (governance)
        if: needs.plan_and_check.outputs.mode == 'governance'
        run: cargo test -p quantrule-governance

      - name: Tests (full)
        if: needs.plan_and_check.outputs.mode == 'full'
        run: cargo test

      - name: Documentation (governance)
        if: needs.plan_and_check.outputs.mode == 'governance'
        run: cargo doc -p quantrule-governance --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Documentation (full)
        if: needs.plan_and_check.outputs.mode == 'full'
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  web:
    needs: plan_and_check
    if: needs.plan_and_check.outputs.mode == 'web' || needs.plan_and_check.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Cache Bun
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install the client dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build

  web-e2e:
    needs: plan_and_check
    if: needs.plan_and_check.outputs.mode == 'web' || needs.plan_and_check.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Cache Bun
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache Playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install the client dependencies
        run: bun install --frozen-lockfile

      - name: Install the browser
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests
        run: bun run e2e

  web-cross-browser:
    needs: plan_and_check
    if: needs.plan_and_check.outputs.mode == 'web' || needs.plan_and_check.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Cache Bun
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache Playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install the client dependencies
        run: bun install --frozen-lockfile

      - name: Install Firefox
        run: bunx playwright install --with-deps firefox

      - name: Firefox end-to-end tests
        run: bunx playwright test --project=firefox

  gate:
    name: Gate
    if: always()
    needs: [plan_and_check, rust, web, web-e2e, web-cross-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the scoped gate
        shell: bash
        run: |
          mode="${{ needs.plan_and_check.outputs.mode }}"
          status=0
          check() {
            if [ "$1" != "success" ]; then
              echo "::error::$2 is $1"
              status=1
            fi
          }
          check "${{ needs.plan_and_check.result }}" plan_and_check
          case "$mode" in
            docs)
              ;;
            governance)
              check "${{ needs.rust.result }}" rust
              ;;
            web)
              check "${{ needs.web.result }}" web
              check "${{ needs.web-e2e.result }}" web-e2e
              check "${{ needs.web-cross-browser.result }}" web-cross-browser
              ;;
            full)
              check "${{ needs.rust.result }}" rust
              check "${{ needs.web.result }}" web
              check "${{ needs.web-e2e.result }}" web-e2e
              check "${{ needs.web-cross-browser.result }}" web-cross-browser
              ;;
            *)
              echo "::error::unknown gate mode '$mode'"
              status=1
              ;;
          esac
          if [ "$status" -ne 0 ]; then
            exit 1
          fi
          echo "gate ok: $mode"

  release-binaries:
    name: Release binaries
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install the pinned toolchain
        run: rustup show

      - name: Cache the release build
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2.9.3
        with:
          workspaces: ". -> target"
          shared-key: "release-binaries"
          add-job-id-key: false
          cache-targets: true
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the seven service binaries
        run: |
          cargo build --release --locked \
            -p quantrule-gateway \
            -p quantrule-backtest-service \
            -p quantrule-data-service \
            -p quantrule-model-service \
            -p quantrule-evidence-service \
            -p quantrule-simulation-service \
            -p quantrule-strategy-service \
            --bins

      - name: Write the release-binary manifest
        run: |
          mkdir -p release-binaries
          find target/release -maxdepth 1 -type f -name 'qr-*' ! -name '*.d' \
            -exec cp {} release-binaries/ \;
          awk -F'"' '/^version = /{print $2; exit}' Cargo.toml > release-binaries/version
          (cd release-binaries && sha256sum qr-* version > manifest.sha256)
          cat release-binaries/manifest.sha256

      - name: Upload the release binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-binaries-${{ github.sha }}
          path: release-binaries
          if-no-files-found: error
