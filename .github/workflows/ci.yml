# The quality gate for the Rust workspace.
#
# The toolchain is pinned by rust-toolchain.toml. The runner already has
# rustup, so `rustup show` installs the pinned toolchain and components.
# The four commands are the same ones documented in README.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install the pinned toolchain
        run: rustup show

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings

      - name: File size
        run: python3 tools/check_file_size.py

      - name: Structure
        run: |
          python3 -m unittest discover -s tools -p 'test_check_structure.py'
          python3 tools/check_structure.py

      - name: Workflows
        run: |
          python3 -m unittest discover -s tools -p 'test_check_workflows.py'
          python3 tools/check_workflows.py

      - name: Execution plans
        run: |
          python3 -m unittest discover -s tools -p 'test_check_execution_plans.py'
          python3 tools/check_execution_plans.py

      - name: Claim types
        run: |
          python3 -m unittest discover -s tools -p 'test_check_claims.py'
          python3 tools/check_claims.py

      - name: Changelog
        run: |
          python3 -m unittest discover -s tools -p 'test_check_changelog.py'
          python3 tools/check_changelog.py

      - name: Releases
        run: |
          python3 -m unittest discover -s tools -p 'test_check_releases.py'
          python3 tools/check_releases.py

      - name: Partitions
        run: |
          python3 -m unittest discover -s tools -p 'test_check_partitions.py'
          python3 tools/check_partitions.py

      - name: Data tooling
        run: |
          python3 -m py_compile tools/data/*.py
          python3 -m unittest discover -s tools/data -p 'test_*.py'

      - name: Chart tooling
        run: |
          python3 -m py_compile tools/charts/*.py
          python3 -m unittest discover -s tools/charts -p 'test_*.py'

      - name: Trade tooling
        run: |
          python3 -m py_compile tools/trades/*.py
          python3 -m unittest discover -s tools/trades -p 'test_*.py'

      - name: Tests
        run: cargo test

      - name: Progression oracle
        run: |
          python3 -m unittest discover -s tools/oracle -p 'test_*.py'
          python3 tools/oracle/progression_replay.py --check

      - name: Registry
        run: python3 tools/check_registry.py

      - name: Verification matrices
        run: python3 tools/check_verification_matrix.py

      - name: Verification evidence
        run: python3 tools/check_verification.py

      - name: Event emitters
        run: python3 tools/check_event_emitters.py

      - name: Validation claims
        run: python3 tools/check_validation.py

      - name: Command surface
        run: python3 tools/check_command_surface.py

      - name: Documentation links
        run: python3 tools/check_links.py

      - name: Workflow terms
        run: python3 tools/check_terms.py

      - name: Legacy labels
        run: python3 tools/check_legacy.py

      # Historical tooling retained for reproducibility; not part of the current shell surface.
      - name: Historical improvement tooling
        run: |
          python3 -m py_compile tools/improvement/*.py tools/check_terms.py
          python3 -m unittest discover -s tools/improvement -p 'test_*.py'

      # Historical tooling retained for reproducibility; not part of the current shell surface.
      - name: Historical research tooling and coverage
        run: |
          python3 -m py_compile tools/research/*.py
          python3 -m unittest discover -s tools/research -p 'test_*.py'
          python3 tools/research/program.py --program config/research/PROGRAM-2026-11-05-03/program.json --check
          python3 tools/research/coverage.py --program config/research/PROGRAM-2026-11-05-03/program.json

      - name: Documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install the Tauri native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xvfb

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install the frontend dependencies
        run: npm ci

      - name: Frontend check
        run: npm run check

      - name: Frontend unit tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        run: npm run test:e2e

      - name: Desktop backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Desktop backend lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Desktop native build
        run: npm run tauri build

      - name: Stage and check the download page
        run: ../../site/build.sh --skip-build

      - name: Desktop launch smoke
        run: |
          set +e
          xvfb-run -a timeout 15 ./src-tauri/target/release/quantrule-desktop
          code=$?
          if [ "$code" -ne 124 ]; then
            exit "$code"
          fi

      - name: AppImage launch smoke
        run: |
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a timeout 15 ./src-tauri/target/release/bundle/appimage/*.AppImage
          code=$?
          if [ "$code" -ne 124 ]; then
            exit "$code"
          fi
