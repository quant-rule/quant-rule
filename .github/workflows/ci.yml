# The quality gate for the Rust workspace.
#
# The toolchain is pinned by rust-toolchain.toml. The runner already has
# rustup, so `rustup show` installs the pinned toolchain and components.
# The four commands are the same ones documented in README.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install the pinned toolchain
        run: rustup show

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Progression oracle
        run: |
          python3 -m unittest discover -s tools/oracle -p 'test_*.py'
          python3 tools/oracle/progression_replay.py --check

      - name: Documentation links
        run: python3 tools/check_links.py

      - name: Workflow terms
        run: python3 tools/check_terms.py

      - name: Improvement tooling
        run: |
          python3 -m py_compile tools/improvement/*.py tools/check_terms.py
          python3 -m unittest discover -s tools/improvement -p 'test_*.py

      - name: Documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
