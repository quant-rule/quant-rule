# The desktop supervisor is packaging, not a service: it starts the six
# services, checks their health, and stops them. It depends on no crate at all,
# which is how the boundary test proves it cannot link an engine, the
# application service, or Tauri. It is deliberately outside the Rust workspace,
# like the shell that spawns it, so the workspace gate does not need desktop
# libraries.
[workspace]

[package]
name = "quantrule-desktop-supervisor"
version = "1.4.2"
edition = "2024"
rust-version = "1.99"
description = "Starts, health-checks, restarts, and stops the six QuantRule desktop sidecars."
publish = false

[[bin]]
name = "qr-desktop"
path = "src/main.rs"

# The stub stands in for the six service binaries in the supervisor lifecycle
# tests. It is a test fixture: the packaging script stages only qr-desktop and
# the six qr-* services, so the stub never ships in an installer.
[[bin]]
name = "stub-sidecar"
path = "src/bin/stub_sidecar.rs"

[features]
default = []
# The release desktop build enables this so a packaged supervisor starts the
# sidecars. A plain development build stays on the external profile and needs
# no services, which keeps `cargo test` and a manual run honest before the
# embedded backends land (#693/#694).
embedded-profile = []

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
