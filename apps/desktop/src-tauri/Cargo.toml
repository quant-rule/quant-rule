[package]
name = "quantrule-desktop"
version = "0.1.0"
description = "The QuantRule local research workstation"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "quantrule_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
quantrule-app = { path = "../../../crates/quantrule-app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[workspace]
